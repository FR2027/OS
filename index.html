<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FRX OS 1</title>
  <style>
    /* ==========================================
       1. 全局設計系統 (iOS Glassmorphism & Liquid UI)
       ========================================== */
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.25);
      --glass-blur: blur(35px) saturate(190%);
      --glass-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.4);
      --dock-collapsed: 98px;
      --dock-expanded: 184px;
      --spring-curve: cubic-bezier(0.19, 1, 0.22, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: var(--font-family);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050508;
      color: #fff;
    }

    /* 滿版動態桌布 (Liquid Wallpaper) */
    .frx-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      overflow: hidden;
    }

    /* ==========================================
       2. 頂部狀態欄與動態島 (Dynamic Island & Status)
       ========================================== */
    .status-bar {
      height: 48px;
      width: 100%;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      z-index: 100;
    }

    .dynamic-island {
      width: 120px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 101;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .island-dot {
      width: 10px;
      height: 10px;
      background: #09f;
      border-radius: 50%;
      box-shadow: 0 0 8px #09f;
    }

    /* ==========================================
       3. 主螢幕系統 (Workspace & Widgets)
       ========================================== */
    .workspace {
      flex: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 12px 24px 120px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: transform 0.45s var(--spring-curve), opacity 0.4s ease;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .workspace::-webkit-scrollbar { display: none; }

    /* 當 Dock 拉伸展開時，主畫面後退並微縮 */
    .frx-container.dock-active .workspace {
      transform: translateY(-24px) scale(0.96);
      opacity: 0.75;
      filter: blur(2px);
    }

    /* 大型系統 Widget */
    .widget-hero {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      padding: 22px 24px;
      box-shadow: var(--glass-shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .widget-hero .os-tag {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.4) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .widget-hero .os-desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 4px;
    }

    /* 4x4 主螢幕 App 網格 */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px 18px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .app-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .app-item:active .app-icon {
      transform: scale(0.88);
    }

    .app-name {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.1px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    /* ==========================================
       4. 核心功能：可拉伸 8 Apps 快捷 Dock (Break the Norm)
       ========================================== */
    .dock-wrapper {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 440px;
      height: var(--dock-collapsed);
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 40px;
      padding: 10px 16px;
      box-shadow: var(--glass-shadow), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.4);
      transition: height 0.5s var(--spring-curve), background 0.3s ease;
      overflow: hidden;
      z-index: 200;
      touch-action: none;
    }

    /* 頂部拉伸指示條 */
    .dock-pill {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 2px;
      margin: 0 auto 10px;
      cursor: grab;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .dock-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 64px);
      gap: 16px;
      width: 100%;
    }

    /* 第二排 Apps (5~8) 預設隱藏並帶有位移漸變 */
    .dock-grid .app-item:nth-child(n+5) {
      opacity: 0;
      transform: translateY(30px) scale(0.75);
      transition: opacity 0.35s ease, transform 0.4s var(--spring-curve);
      pointer-events: none;
    }

    /* Dock 展開狀態樣式 */
    .frx-container.dock-active .dock-wrapper {
      height: var(--dock-expanded);
      background: rgba(255, 255, 255, 0.22);
    }

    .frx-container.dock-active .dock-pill {
      width: 56px;
      background: rgba(255, 255, 255, 0.8);
    }

    .frx-container.dock-active .dock-grid .app-item:nth-child(n+5) {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* 展開時第二排 4 個 App 的階梯式交錯動畫 */
    .frx-container.dock-active .dock-grid .app-item:nth-child(5) { transition-delay: 0.04s; }
    .frx-container.dock-active .dock-grid .app-item:nth-child(6) { transition-delay: 0.08s; }
    .frx-container.dock-active .dock-grid .app-item:nth-child(7) { transition-delay: 0.12s; }
    .frx-container.dock-active .dock-grid .app-item:nth-child(8) { transition-delay: 0.16s; }

    /* 全螢幕底部 Home Indicator */
    .home-bar {
      width: 140px;
      height: 5px;
      background: #fff;
      border-radius: 3px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 250;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="frx-container" id="frx-system">
    
    <!-- 1. 頂部狀態欄與動態島 -->
    <div class="dynamic-island">
      <span style="font-size: 11px; color: #8e8e93;">FRX Core</span>
      <div class="island-dot"></div>
    </div>

    <div class="status-bar">
      <span id="clock">09:41</span>
      <div style="display:flex; gap:8px; align-items:center;">
        <span>5G</span>
        <span>100%</span>
      </div>
    </div>

    <!-- 2. 主螢幕空間 Workspace -->
    <div class="workspace">
      <!-- 系統抬頭卡片 -->
      <div class="widget-hero">
        <div>
          <div class="os-tag">FRX OS 1</div>
          <div class="os-desc">打破常規：向上拉伸底部 Dock 體驗 8 Apps</div>
        </div>
        <div style="font-size: 32px;">✨</div>
      </div>

      <!-- 主螢幕圖示網格 -->
      <div class="app-grid">
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #FF9500, #FF5E00);">📷</div><span class="app-name">相機</span></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #34C759, #008E00);">🖼️</div><span class="app-name">相簿</span></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #5856D6, #3634A3);">⚙️</div><span class="app-name">設定</span></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #FF2D55, #D10040);">🎵</div><span class="app-name">音樂</span></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #007AFF, #0040DD);">☁️</div><span class="app-name">天氣</span></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #FFCC00, #FFA000);">💡</div><span class="app-name">靈感</span></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #A259FF, #631BFF);">🎮</div><span class="app-name">遊戲</span></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #FF6B6B, #FF0055);">📊</div><span class="app-name">數據</span></div>
      </div>
    </div>

    <!-- 3. 核心功能：可拉伸展開成 8 個 App 的 Dock 欄 -->
    <div class="dock-wrapper" id="dock-bar">
      <div class="dock-pill"></div>
      
      <div class="dock-grid">
        <!-- 預設第一排 4 個 Apps (1 ~ 4) -->
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #34C759, #119922);">📞</div></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #007AFF, #0055FF);">💬</div></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #55E0C4, #00A88F);">🌐</div></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #FA114F, #AF002D);">🎧</div></div>

        <!-- 拉伸後顯現的第二排 4 個 Apps (5 ~ 8) -->
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #A259FF, #631BFF);">🚀</div></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #FF6B6B, #FF0055);">🔥</div></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #4D96FF, #0055FF);">📂</div></div>
        <div class="app-item"><div class="app-icon" style="background: linear-gradient(135deg, #6BCB77, #109028);">📝</div></div>
      </div>
    </div>

    <!-- 底部條 -->
    <div class="home-bar"></div>
  </div>

  <!-- ==========================================
       5. 系統手勢與邏輯 Engine
       ========================================== -->
  <script>
    const sys = document.getElementById('frx-system');
    const dock = document.getElementById('dock-bar');
    const clock = document.getElementById('clock');
    
    let startY = 0;
    let isDragging = false;
    let isExpanded = false;

    // 即時時鐘
    function updateClock() {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      clock.textContent = `${hrs}:${mins}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 點擊 Dock 觸發拉伸/收合
    dock.addEventListener('click', (e) => {
      if (e.target.closest('.app-item')) return;
      toggleDock();
    });

    // 手勢拖拽 (Touch & Mouse)
    dock.addEventListener('touchstart', onStart, {passive: true});
    dock.addEventListener('mousedown', onStart);

    window.addEventListener('touchmove', onMove, {passive: true});
    window.addEventListener('mousemove', onMove);

    window.addEventListener('touchend', onEnd);
    window.addEventListener('mouseup', onEnd);

    function onStart(e) {
      startY = e.touches ? e.touches[0].clientY : e.clientY;
      isDragging = true;
    }

    function onMove(e) {
      if (!isDragging) return;
      const currentY = e.touches ? e.touches[0].clientY : e.clientY;
      const deltaY = startY - currentY;

      // 向上拉動超過 35px 展開，向下拉動超過 35px 收合
      if (deltaY > 35 && !isExpanded) {
        setDock(true);
        isDragging = false;
      } else if (deltaY < -35 && isExpanded) {
        setDock(false);
        isDragging = false;
      }
    }

    function onEnd() {
      isDragging = false;
    }

    function toggleDock() {
      setDock(!isExpanded);
    }

    function setDock(expand) {
      isExpanded = expand;
      if (isExpanded) {
        sys.classList.add('dock-active');
      } else {
        sys.classList.remove('dock-active');
      }
    }
  </script>
</body>
</html>
