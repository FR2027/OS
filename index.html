<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FRX OS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/0RHgQJcw/Background-Eraser.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://i.ibb.co/0RHgQJcw/Background-Eraser.png">

  <title>FRX OS 1 Ultimate Ecosystem</title>

  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      --glass-bg: rgba(255, 255, 255, 0.18);
      --glass-border: rgba(255, 255, 255, 0.28);
      --glass-blur: blur(35px) saturate(200%);
      --spring-physics: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --ease-apple: cubic-bezier(0.32, 0.72, 0, 1);
      --icon-size: 58px;
      --icon-radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
      position: fixed;
      inset: 0;
    }

    .frx-os {
      width: 100vw;
      height: 100dvh;
      position: relative;
      background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: filter 0.3s ease;
    }

    /* Status Bar & Dynamic Island */
    .status-bar {
      height: calc(44px + var(--safe-top));
      padding-top: var(--safe-top);
      padding-left: 24px;
      padding-right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      z-index: 800;
      position: relative;
      cursor: pointer;
    }

    .dynamic-island {
      width: 130px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: calc(8px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 850;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
      transition: all 0.35s var(--ease-apple);
      cursor: pointer;
      overflow: hidden;
    }
    .dynamic-island.expanded {
      width: 320px;
      height: 75px;
      border-radius: 38px;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
    }
    .island-dot { width: 8px; height: 8px; background: #34C759; border-radius: 50%; box-shadow: 0 0 8px #34C759; }
    .island-content { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #fff; width: 100%; overflow: hidden; white-space: nowrap; }

    /* Main Screen */
    .main-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: calc(10px + var(--safe-top)) 20px calc(130px + var(--safe-bottom));
      gap: 16px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .widget-banner {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
    }
    .widget-img-container {
      width: 46px; height: 46px; background: rgba(255, 255, 255, 0.12);
      border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .widget-img-container img { width: 80%; height: 80%; object-fit: contain; }

    /* Quick Action Widgets */
    .quick-widgets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .quick-widget-card {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .quick-widget-card:active { transform: scale(0.94); }
    .quick-widget-card span:first-child { font-size: 22px; }
    .quick-widget-card span:last-child { font-size: 11px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 12px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease;
    }
    .app-item:active { transform: scale(0.88); }

    .app-icon {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: var(--icon-radius);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      position: relative;
    }
    .app-name { font-size: 11px; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.8); text-align: center; }

    /* Editing Mode */
    @keyframes jiggle {
      0% { transform: rotate(-1.8deg) scale(1.02); }
      50% { transform: rotate(1.8deg) scale(0.98); }
      100% { transform: rotate(-1.8deg) scale(1.02); }
    }
    .editing .app-item { animation: jiggle 0.22s infinite ease-in-out; }
    .remove-btn {
      position: absolute; top: -6px; left: -6px; width: 22px; height: 22px;
      background: #ff3b30; color: #fff; border-radius: 50%; display: none;
      justify-content: center; align-items: center; font-size: 14px; font-weight: bold; z-index: 10;
    }
    .editing .remove-btn { display: flex; }

    /* Dock */
    .dock-wrapper {
      position: absolute;
      bottom: calc(15px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 38px;
      padding: 8px 14px 12px;
      z-index: 700;
      transition: height 0.42s var(--spring-physics);
      height: 92px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .dock-handle { width: 42px; height: 5px; background: rgba(255,255,255,0.6); border-radius: 3px; margin-bottom: 8px; cursor: pointer; }
    .dock-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 16px; width: 100%; }
    .dock-wrapper.expanded { height: 184px; border-radius: 42px; }

    /* App Window */
    .app-window {
      position: absolute;
      inset: 0;
      background: #121217;
      z-index: 900;
      display: flex;
      flex-direction: column;
      transform: scale(0.85) translateY(100%);
      opacity: 0;
      border-radius: 42px;
      transition: transform 0.45s var(--ease-apple), opacity 0.3s ease, border-radius 0.35s ease;
      pointer-events: none;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    .app-window.active {
      transform: scale(1) translateY(0);
      opacity: 1;
      border-radius: 0px;
      pointer-events: auto;
    }
    .app-header {
      height: 54px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;
      background: #1c1c24; border-bottom: 1px solid #2c2c38; font-weight: 700;
    }
    .app-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; }

    /* Control & Notification Centers */
    .control-center, .notification-center {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      z-index: 950; display: flex; flex-direction: column; padding: calc(60px + var(--safe-top)) 20px 40px;
      transform: translateY(-100%); transition: transform 0.4s var(--ease-apple);
    }
    .control-center.active, .notification-center.active { transform: translateY(0); }

    .control-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .control-card { background: rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .control-btn { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.1); padding: 12px; border-radius: 14px; cursor: pointer; }
    .control-btn.active { background: #0a84ff; }

    /* App Switcher */
    .app-switcher {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
      z-index: 970; display: flex; align-items: center; justify-content: center; gap: 20px;
      transform: scale(1.1); opacity: 0; pointer-events: none; transition: transform 0.35s var(--ease-apple), opacity 0.3s ease;
    }
    .app-switcher.active { transform: scale(1); opacity: 1; pointer-events: auto; }
    .switcher-card {
      width: 220px; height: 380px; background: #1c1c24; border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.2); display: flex; flex-direction: column; overflow: hidden; cursor: pointer; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    /* Flashlight Overlay */
    .flashlight-overlay {
      position: absolute; inset: 0; background: #ffffff; z-index: 9999; display: none;
      align-items: center; justify-content: center; cursor: pointer;
    }
    .flashlight-overlay.active { display: flex; }

    /* Home Bar */
    .home-bar-area {
      position: absolute; bottom: 0; left: 0; width: 100%; height: calc(30px + var(--safe-bottom));
      z-index: 999; display: flex; justify-content: center; align-items: flex-end;
      padding-bottom: calc(8px + var(--safe-bottom)); pointer-events: auto; cursor: pointer;
    }
    .home-bar { width: 140px; height: 5px; background: #fff; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }

    .settings-group { background: #1c1c24; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .settings-title { font-size: 12px; text-transform: uppercase; color: #8e8e93; margin-bottom: 10px; font-weight: 600; }
    .setting-input { background: #2c2c38; border: none; padding: 10px 14px; border-radius: 10px; color: #fff; width: 100%; font-size: 14px; outline: none; }
    .setting-btn { background: #0a84ff; color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    iframe.app-iframe { width: 100%; height: 100%; border: none; flex: 1; }
  </style>
</head>
<body>

  <div class="frx-os" id="frx-os">

    <div class="flashlight-overlay" id="flashlight-overlay" onclick="toggleFlashlight()">
      <span style="color:#000;font-size:24px;font-weight:bold;">💡 手電筒開啟中 (點擊關閉)</span>
    </div>

    <!-- Status Bar & Dynamic Island -->
    <div class="status-bar" id="status-bar" onclick="toggleControlCenter()">
      <span id="clock">21:20</span>
      <div class="dynamic-island" id="dynamic-island" onclick="event.stopPropagation(); toggleIsland();">
        <div class="island-content" id="island-content">
          <span id="island-text" style="font-weight:700;">FRX Pro</span>
        </div>
        <div class="island-dot"></div>
      </div>
      <div><span id="net-status">5G</span> <span style="margin-left:4px;" id="battery-status">100%</span></div>
    </div>

    <!-- Main Screen -->
    <div class="main-screen" id="main-screen">
      <div class="widget-banner">
        <div>
          <h2 style="font-size: 18px;">FRX OS 旗艦生態系</h2>
          <p style="font-size: 11px; color: #ccc; margin-top: 2px;">20+ 款原生與實用功能完美搭載</p>
        </div>
        <div class="widget-img-container">
          <img src="https://i.ibb.co/0RHgQJcw/Background-Eraser.png" alt="FRX Logo">
        </div>
      </div>

      <!-- Quick Action Widgets -->
      <div class="quick-widgets">
        <div class="quick-widget-card" onclick="togglePlayMusic()">
          <span>🎵</span>
          <span id="widget-music-text">播放音樂</span>
        </div>
        <div class="quick-widget-card" onclick="toggleFlashlight()">
          <span>🔦</span>
          <span>手電筒</span>
        </div>
        <div class="quick-widget-card" onclick="openApp('貪食蛇')">
          <span>🎮</span>
          <span>貪食蛇</span>
        </div>
      </div>

      <div class="app-grid" id="app-grid"></div>
    </div>

    <!-- Dock -->
    <div class="dock-wrapper" id="dock-wrapper">
      <div class="dock-handle" id="dock-handle" onclick="toggleDock()"></div>
      <div class="dock-grid" id="dock-grid"></div>
    </div>

    <!-- App Window -->
    <div class="app-window" id="app-window">
      <div class="app-header">
        <span id="app-title">App</span>
        <button style="color:#0a84ff;background:none;border:none;font-weight:600;font-size:14px;cursor:pointer;" onclick="closeApp()">完成</button>
      </div>
      <div class="app-body" id="app-body"></div>
    </div>

    <!-- Notification Center -->
    <div class="notification-center" id="notification-center">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2>通知中心</h2>
        <button onclick="toggleNotificationCenter()" style="color:#0a84ff;background:none;border:none;font-size:16px;">關閉</button>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px;" id="notification-list">
        <div style="background:rgba(255,255,255,0.15);padding:14px;border-radius:16px;">
          <strong style="color:#34C759;">FRX 系統</strong>
          <p style="font-size:13px;color:#ddd;margin-top:4px;">系統已載入 20+ 款完整軟體應用生態。</p>
        </div>
      </div>
    </div>

    <!-- Control Center -->
    <div class="control-center" id="control-center">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2>控制中心</h2>
        <button onclick="toggleControlCenter()" style="color:#0a84ff;background:none;border:none;font-size:16px;">關閉</button>
      </div>
      <div class="control-grid">
        <div class="control-card">
          <div class="control-btn active" id="btn-wifi" onclick="toggleControl('wifi')"><span>📶</span> <span>Wi-Fi</span></div>
          <div class="control-btn active" id="btn-bt" onclick="toggleControl('bt')"><span>📡</span> <span>藍牙</span></div>
          <div class="control-btn" id="btn-flashlight" onclick="toggleFlashlight()"><span>🔦</span> <span>手電筒</span></div>
        </div>
        <div class="control-card">
          <label style="font-size:12px;color:#aaa;">螢幕亮度</label>
          <input type="range" min="30" max="100" value="100" oninput="adjustBrightness(this.value)" style="width:100%;">
        </div>
      </div>
    </div>

    <!-- App Switcher -->
    <div class="app-switcher" id="app-switcher" onclick="closeSwitcher()">
      <div class="switcher-card" onclick="openApp('瀏覽器')">
        <div style="background:#1c1c24;padding:10px;font-weight:bold;font-size:12px;border-bottom:1px solid #333;">🌐 瀏覽器</div>
        <div style="flex:1;background:#222;display:flex;align-items:center;justify-content:center;color:#666;font-size:24px;">🌐</div>
      </div>
    </div>

    <div class="home-bar-area" id="home-bar-area" onclick="toggleSwitcher()"><div class="home-bar"></div></div>
  </div>

  <script>
    const appsData = [
      { id: 'camera', name: '相機', icon: '📷', bg: 'linear-gradient(135deg, #FF9500, #FF5E00)' },
      { id: 'photos', name: '相簿', icon: '🖼️', bg: 'linear-gradient(135deg, #34C759, #008E00)' },
      { id: 'calc', name: '計算機', icon: '🧮', bg: 'linear-gradient(135deg, #FF9F0A, #FF7B00)' },
      { id: 'contacts', name: '聯絡人', icon: '📇', bg: 'linear-gradient(135deg, #007AFF, #0040DD)' },
      { id: 'settings', name: '設定', icon: '⚙️️', bg: 'linear-gradient(135deg, #5856D6, #3634A3)' },
      { id: 'music', name: '音樂', icon: '🎵', bg: 'linear-gradient(135deg, #FF2D55, #D10040)' },
      { id: 'weather', name: '天氣', icon: '☁️', bg: 'linear-gradient(135deg, #007AFF, #0040DD)' },
      { id: 'notes', name: '記事本', icon: '📝', bg: 'linear-gradient(135deg, #FFCC00, #FFA000)' },
      { id: 'clock', name: '時鐘', icon: '⏰', bg: 'linear-gradient(135deg, #FF9500, #C65102)' },
      { id: 'calendar', name: '行事曆', icon: '📅', bg: 'linear-gradient(135deg, #FF3B30, #900)' },
      { id: 'files', name: '檔案', icon: '📁', bg: 'linear-gradient(135deg, #00C7BE, #007A72)' },
      { id: 'recorder', name: '錄音機', icon: '🎙️', bg: 'linear-gradient(135deg, #AF52DE, #6200A0)' },
      { id: 'browser', name: '瀏覽器', icon: '🌐', bg: 'linear-gradient(135deg, #55E0C4, #00A88F)' },
      { id: 'game', name: '貪食蛇', icon: '🎮', bg: 'linear-gradient(135deg, #34C759, #005522)' },
      { id: 'paint', name: '繪圖板', icon: '🎨', bg: 'linear-gradient(135deg, #FF2D55, #FF9500)' },
      { id: 'phone', name: '電話', icon: '📞', bg: 'linear-gradient(135deg, #34C759, #119922)' }
    ];

    const os = document.getElementById('frx-os');
    const appGrid = document.getElementById('app-grid');
    const dockGrid = document.getElementById('dock-grid');
    const dockWrapper = document.getElementById('dock-wrapper');
    const appWindow = document.getElementById('app-window');
    const appTitle = document.getElementById('app-title');
    const appBody = document.getElementById('app-body');
    const clock = document.getElementById('clock');
    const dynamicIsland = document.getElementById('dynamic-island');
    const islandContent = document.getElementById('island-content');
    const controlCenter = document.getElementById('control-center');
    const notificationCenter = document.getElementById('notification-center');
    const appSwitcher = document.getElementById('app-switcher');

    let isEditing = false;
    let isMusicPlaying = false;
    let audioElem = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
    audioElem.loop = true;

    let settings = JSON.parse(localStorage.getItem('frx_settings')) || {
      bgUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000',
      islandText: 'FRX Pro'
    };

    function applySettings() {
      os.style.backgroundImage = `url('${settings.bgUrl}')`;
      document.getElementById('island-text').textContent = settings.islandText;
    }
    applySettings();

    function renderApps() {
      appGrid.innerHTML = '';
      dockGrid.innerHTML = '';
      appsData.slice(0, 12).forEach(app => appGrid.appendChild(createAppElem(app)));
      appsData.slice(12, 16).forEach(app => dockGrid.appendChild(createAppElem(app, true)));
    }

    function createAppElem(app, isDock = false) {
      const item = document.createElement('div');
      item.className = 'app-item';
      item.onclick = () => { if (!isEditing) openApp(app.name); };
      let pressTimer;
      item.ontouchstart = () => { pressTimer = setTimeout(enableEditing, 600); };
      item.ontouchend = () => clearTimeout(pressTimer);
      item.innerHTML = `
        <div class="remove-btn" onclick="event.stopPropagation(); removeApp(this)">—</div>
        <div class="app-icon" style="background:${app.bg};">${app.icon}</div>
        ${!isDock ? `<span class="app-name">${app.name}</span>` : ''}
      `;
      return item;
    }

    function enableEditing() { isEditing = true; document.body.classList.add('editing'); }
    document.getElementById('main-screen').onclick = (e) => {
      if (e.target.id === 'main-screen' || e.target.className === 'app-grid') {
        isEditing = false; document.body.classList.remove('editing');
      }
    };
    function removeApp(btn) { btn.parentElement.style.transform = 'scale(0)'; setTimeout(() => btn.parentElement.remove(), 200); }
    function toggleDock() { dockWrapper.classList.toggle('expanded'); }

    function updateTime() {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      clock.textContent = timeStr;
      const wc = document.getElementById('world-clock');
      if (wc) {
        wc.textContent = `${timeStr}:${String(now.getSeconds()).padStart(2, '0')}`;
      }
    }
    setInterval(updateTime, 1000);
    updateTime();

    function toggleIsland() { dynamicIsland.classList.toggle('expanded'); }
    function setIslandContent(html) { islandContent.innerHTML = html; }
    function toggleControlCenter() { controlCenter.classList.toggle('active'); }
    function toggleNotificationCenter() { notificationCenter.classList.toggle('active'); }
    function toggleSwitcher() { appSwitcher.classList.toggle('active'); }
    function closeSwitcher() { appSwitcher.classList.remove('active'); }
    function toggleFlashlight() { document.getElementById('flashlight-overlay').classList.toggle('active'); }
    function adjustBrightness(val) { os.style.filter = `brightness(${val}%)`; }
    function toggleControl(type) {
      if(type === 'wifi' || type === 'bt') {
        const btn = document.getElementById(`btn-${type}`);
        btn.classList.toggle('active');
        document.getElementById('net-status').textContent = btn.classList.contains('active') ? '5G' : '無連線';
      }
    }

    function openApp(name) {
      appTitle.textContent = name;
      appBody.innerHTML = '';

      if (name === '相機') { renderCameraApp(); }
      else if (name === '相簿') { renderPhotosApp(); }
      else if (name === '計算機') { renderCalcApp(); }
      else if (name === '音樂') { renderMusicApp(); }
      else if (name === '天氣') { renderWeatherApp(); }
      else if (name === '記事本') { renderNotesApp(); }
      else if (name === '時鐘') { renderClockApp(); }
      else if (name === '行事曆') { renderCalendarApp(); }
      else if (name === '檔案') { renderFilesApp(); }
      else if (name === '錄音機') { renderRecorderApp(); }
      else if (name === '聯絡人') { renderContactsApp(); }
      else if (name === '電話') { renderPhoneApp(); }
      else if (name === '貪食蛇') { renderGameApp(); }
      else if (name === '繪圖板') { renderPaintApp(); }
      else if (name === '瀏覽器') {
        appBody.innerHTML = `
          <div style="padding:10px;background:#1c1c24;display:flex;gap:8px;align-items:center;">
            <input type="text" id="browser-url" value="https://duckduckgo.com" class="setting-input">
            <button onclick="navigateUrl()" class="setting-btn">前往</button>
          </div>
          <iframe id="browser-iframe" class="app-iframe" src="https://duckduckgo.com"></iframe>
        `;
      } else if (name === '設定') { renderSettingsApp(); }

      appWindow.classList.add('active');
    }

    function closeApp() {
      appWindow.classList.remove('active');
      stopCamera();
      if (!isMusicPlaying) {
        setIslandContent(`<span id="island-text" style="font-weight:700;">${settings.islandText}</span>`);
      }
    }

    /* 軟體實作群組 */
    let videoStream = null;
    async function renderCameraApp() {
      appBody.innerHTML = `
        <div style="flex:1;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px;">
          <video id="camera-video" autoplay playsinline style="width:100%;height:68%;object-fit:cover;border-radius:24px;background:#222;"></video>
          <div style="display:flex;gap:15px;">
            <button onclick="takePhoto()" style="width:70px;height:70px;border-radius:50%;border:4px solid #fff;background:none;cursor:pointer;"></button>
          </div>
        </div>
      `;
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        document.getElementById('camera-video').srcObject = videoStream;
      } catch { alert('無法存取相機'); }
    }
    function stopCamera() { if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; } }
    function takePhoto() {
      const video = document.getElementById('camera-video');
      if (!video) return;
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const photos = JSON.parse(localStorage.getItem('frx_photos')) || [];
      photos.unshift(canvas.toDataURL('image/png'));
      localStorage.setItem('frx_photos', JSON.stringify(photos));
      alert('📸 照片已儲存至相簿！');
    }

    function renderPhotosApp() {
      const photos = JSON.parse(localStorage.getItem('frx_photos')) || [];
      appBody.innerHTML = `
        <div style="padding:16px;">
          <h2 style="font-size:18px;margin-bottom:12px;">相簿 (${photos.length})</h2>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
            ${photos.map((p, i) => `<div style="height:110px;border-radius:12px;overflow:hidden;background:#222;"><img src="${p}" style="width:100%;height:100%;object-fit:cover;"></div>`).join('')}
            ${photos.length === 0 ? '<p style="grid-column:span 3;text-align:center;color:#8e8e93;margin-top:40px;">尚無相片</p>' : ''}
          </div>
        </div>
      `;
    }

    let calcExpr = '0';
    function renderCalcApp() {
      appBody.innerHTML = `
        <div style="margin:auto;width:100%;max-width:320px;padding:20px;display:flex;flex-direction:column;height:100%;justify-content:flex-end;">
          <div id="calc-res" style="font-size:48px;text-align:right;margin-bottom:20px;font-weight:300;">${calcExpr}</div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
            ${['C','/','*','-', '7','8','9','+', '4','5','6','-', '1','2','3','=', '0','.'].map(b => `<button onclick="pressCalc('${b}')" style="height:60px;border-radius:30px;border:none;background:#333;color:#fff;font-size:22px;${b==='='?'background:#ff9f0a;':''}">${b}</button>`).join('')}
          </div>
        </div>
      `;
    }
    function pressCalc(v) {
      const res = document.getElementById('calc-res');
      if (v === 'C') calcExpr = '0';
      else if (v === '=') { try { calcExpr = String(Function(`'use strict'; return (${calcExpr})`)()); } catch { calcExpr = 'Error'; } }
      else { calcExpr = (calcExpr === '0' || calcExpr === 'Error') ? v : calcExpr + v; }
      if (res) res.textContent = calcExpr;
    }

    function renderMusicApp() {
      appBody.innerHTML = `
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;">
          <div style="width:180px;height:180px;background:linear-gradient(135deg, #FF2D55, #5856D6);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:70px;margin-bottom:24px;box-shadow:0 15px 35px rgba(255,45,85,0.4);">🎵</div>
          <h2 style="font-size:20px;margin-bottom:6px;">FRX Ultra Beats</h2>
          <p style="color:#8e8e93;font-size:13px;margin-bottom:20px;">SoundHelix Audio Stream</p>
          <button onclick="togglePlayMusic()" style="width:65px;height:65px;border-radius:50%;background:#0a84ff;color:#fff;border:none;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;">${isMusicPlaying ? '⏸' : '▶'}</button>
        </div>
      `;
    }
    function togglePlayMusic() {
      if (isMusicPlaying) { 
        audioElem.pause(); 
        isMusicPlaying = false; 
        setIslandContent(`<span id="island-text" style="font-weight:700;">${settings.islandText}</span>`);
        document.getElementById('widget-music-text').textContent = '播放音樂';
      } else { 
        audioElem.play(); 
        isMusicPlaying = true; 
        setIslandContent('🎵 <span style="color:#FF2D55;font-weight:bold;">播放中</span>');
        document.getElementById('widget-music-text').textContent = '暫停音樂';
      }
      if (appTitle.textContent === '音樂') renderMusicApp();
    }

    function renderWeatherApp() {
      appBody.innerHTML = `<div style="padding:24px;text-align:center;"><h2 style="font-size:26px;">台灣 · 新竹市</h2><div style="font-size:72px;font-weight:200;margin:15px 0;">27°C</div><p style="color:#8e8e93;">晴時多雲 · 濕度 65%</p></div>`;
    }
    function renderNotesApp() {
      const notes = JSON.parse(localStorage.getItem('frx_notes')) || [];
      appBody.innerHTML = `
        <div style="padding:16px;display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;gap:8px;"><input type="text" id="note-input" placeholder="新記事..." class="setting-input"><button onclick="addNote()" class="setting-btn">新增</button></div>
          ${notes.map((n, i) => `<div style="background:#1c1c24;padding:12px;border-radius:12px;display:flex;justify-content:space-between;"><span>${n}</span><button onclick="deleteNote(${i})" style="color:#ff3b30;background:none;border:none;">刪除</button></div>`).join('')}
        </div>
      `;
    }
    function addNote() {
      const inp = document.getElementById('note-input');
      if(inp && inp.value.trim()){
        const notes = JSON.parse(localStorage.getItem('frx_notes')) || [];
        notes.unshift(inp.value.trim()); localStorage.setItem('frx_notes', JSON.stringify(notes)); renderNotesApp();
      }
    }
    function deleteNote(i) {
      const notes = JSON.parse(localStorage.getItem('frx_notes')) || [];
      notes.splice(i, 1); localStorage.setItem('frx_notes', JSON.stringify(notes)); renderNotesApp();
    }

    function renderClockApp() { appBody.innerHTML = `<div style="padding:24px;text-align:center;"><h2 style="font-size:42px;font-weight:300;margin-top:40px;" id="world-clock">21:20:00</h2><p style="color:#8e8e93;margin-top:10px;">台灣標準時間 (UTC+8)</p></div>`; }
    function renderCalendarApp() { appBody.innerHTML = `<div style="padding:24px;text-align:center;"><h2 style="font-size:24px;margin-bottom:15px;">2026年 10月</h2><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font-size:14px;">${['一','二','三','四','五','六','日'].map(d=>`<b>${d}</b>`).join('')}${Array.from({length:31},(_,i)=>`<div style="padding:10px;background:#1c1c24;border-radius:8px;${i+1===1?'background:#0a84ff;':''}">${i+1}</div>`).join('')}</div></div>`; }
    function renderFilesApp() { appBody.innerHTML = `<div style="padding:16px;"><h2 style="font-size:18px;margin-bottom:12px;">內部儲存空間 (128GB / 256GB)</h2><div style="background:#1c1c24;padding:14px;border-radius:12px;margin-bottom:8px;">📁 相片夾 (${JSON.parse(localStorage.getItem('frx_photos')||'[]').length} 檔案)</div><div style="background:#1c1c24;padding:14px;border-radius:12px;">📁 記事本文件</div></div>`; }
    function renderRecorderApp() { appBody.innerHTML = `<div style="padding:30px;text-align:center;"><div style="font-size:60px;margin-bottom:20px;">🎙️</div><button onclick="alert('🔴 模擬錄音中... 錄製完成！')" class="setting-btn" style="background:#ff3b30;">點擊開始錄音</button></div>`; }
    function renderContactsApp() { appBody.innerHTML = `<div style="padding:16px;"><h2 style="font-size:18px;margin-bottom:10px;">聯絡人</h2><div style="background:#1c1c24;padding:12px;border-radius:12px;">FRX 官方客服 (0900-123-456)</div></div>`; }
    function renderPhoneApp() { appBody.innerHTML = `<div style="padding:30px;text-align:center;"><h2 style="font-size:22px;margin-bottom:20px;">📞 撥號盤</h2><input type="text" id="phone-num" class="setting-input" style="text-align:center;font-size:20px;margin-bottom:15px;"><button onclick="alert('撥號中...')" class="setting-btn" style="background:#34c759;width:100%;">撥出電話</button></div>`; }
    
    function renderGameApp() {
      appBody.innerHTML = `
        <div style="padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;">
          <h2 style="margin-bottom:8px;">🎮 貪食蛇</h2>
          <canvas id="snake-canvas" width="260" height="260" style="background:#000;border:2px solid #333;border-radius:12px;margin-bottom:12px;"></canvas>
          <div style="display:grid;grid-template-columns:repeat(3,60px);gap:6px;margin-bottom:10px;">
            <div></div><button class="setting-btn" onclick="changeSnakeDir('UP')">⬆️️</button><div></div>
            <button class="setting-btn" onclick="changeSnakeDir('LEFT')">⬅️</button><button class="setting-btn" onclick="changeSnakeDir('DOWN')">⬇️</button><button class="setting-btn" onclick="changeSnakeDir('RIGHT')">➡️</button>
          </div>
          <button onclick="startSnakeGame()" class="setting-btn">重新開始</button>
        </div>
      `;
      setTimeout(startSnakeGame, 100);
    }

    let snakeInterval = null;
    let snakeDir = 'RIGHT';
    function startSnakeGame() {
      if (snakeInterval) clearInterval(snakeInterval);
      const canvas = document.getElementById('snake-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let snake = [{x: 5, y: 5}];
      let food = {x: 10, y: 10};
      snakeDir = 'RIGHT';

      function spawnFood() {
        food = {x: Math.floor(Math.random() * 13), y: Math.floor(Math.random() * 13)};
      }
      spawnFood();

      snakeInterval = setInterval(() => {
        let head = {...snake[0]};
        if (snakeDir === 'UP') head.y--;
        if (snakeDir === 'DOWN') head.y++;
        if (snakeDir === 'LEFT') head.x--;
        if (snakeDir === 'RIGHT') head.x++;

        if (head.x < 0 || head.x >= 13 || head.y < 0 || head.y >= 13 || snake.some(p => p.x === head.x && p.y === head.y)) {
          clearInterval(snakeInterval);
          alert('遊戲結束！');
          return;
        }

        snake.unshift(head);
        if (head.x === food.x && head.y === food.y) {
          spawnFood();
        } else {
          snake.pop();
        }

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff3b30';
        ctx.fillRect(food.x * 20, food.y * 20, 18, 18);

        ctx.fillStyle = '#34C759';
        snake.forEach(p => ctx.fillRect(p.x * 20, p.y * 20, 18, 18));
      }, 120);
    }
    function changeSnakeDir(d) {
      if ((d === 'UP' && snakeDir !== 'DOWN') || (d === 'DOWN' && snakeDir !== 'UP') ||
          (d === 'LEFT' && snakeDir !== 'RIGHT') || (d === 'RIGHT' && snakeDir !== 'LEFT')) {
        snakeDir = d;
      }
    }

    function renderPaintApp() {
      appBody.innerHTML = `<div style="padding:16px;display:flex;flex-direction:column;align-items:center;height:100%;"><h2 style="font-size:18px;margin-bottom:10px;">🎨 簡易繪圖板</h2><canvas id="paint-canvas" width="300" height="350" style="background:#fff;border-radius:12px;cursor:crosshair;"></canvas></div>`;
      const canvas = document.getElementById('paint-canvas');
      if(!canvas) return;
      const ctx = canvas.getContext('2d');
      let painting = false;
      canvas.onmousedown = () => painting = true;
      canvas.onmouseup = () => { painting = false; ctx.beginPath(); };
      canvas.onmousemove = (e) => {
        if(!painting) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
      };
    }

    function renderSettingsApp() {
      appBody.innerHTML = `
        <div style="padding:16px;display:flex;flex-direction:column;gap:14px;">
          <div class="settings-group">
            <div class="settings-title">🎨 桌布設定</div>
            <input type="text" id="cfg-bg-url" class="setting-input" value="${settings.bgUrl}">
            <button class="setting-btn" style="margin-top:8px;width:100%;" onclick="updateBgUrl()">套用桌布</button>
          </div>
          <div class="settings-group">
            <div class="settings-title">🏝️ 動態島標題</div>
            <input type="text" id="cfg-island-text" class="setting-input" value="${settings.islandText}" style="margin-bottom:8px;">
            <button class="setting-btn" style="width:100%;" onclick="updateIslandText()">更新動態島</button>
          </div>
        </div>
      `;
    }

    function navigateUrl() {
      let url = document.getElementById('browser-url').value;
      if (!url.startsWith('http')) url = 'https://' + url;
      document.getElementById('browser-iframe').src = url;
    }
    function updateBgUrl() {
      const url = document.getElementById('cfg-bg-url').value;
      if(url) { settings.bgUrl = url; localStorage.setItem('frx_settings', JSON.stringify(settings)); applySettings(); alert('✨ 桌布已更新！'); }
    }
    function updateIslandText() {
      const txt = document.getElementById('cfg-island-text').value;
      if(txt) { settings.islandText = txt; localStorage.setItem('frx_settings', JSON.stringify(settings)); applySettings(); alert('🏝️ 動態島已更新！'); }
    }

    renderApps();
  </script>
</body>
</html>
