<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FRX OS - Organic UI Simulator</title>
    <style>
        :root {
            /* 告別駭客黑！改用溫潤莫蘭迪與柔光色系 */
            --bg-gradient: linear-gradient(145deg, #181926 0%, #202236 40%, #2e2a3a 70%, #1c2333 100%);
            --glass-card: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-hover: rgba(255, 255, 255, 0.15);
            --accent-warm: #f6b179;
            --accent-soft: #a0c4ff;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.65);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==================== 1. 高質感極簡加載頁面 ==================== */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #12131c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.2s ease, visibility 1.2s;
        }

        .frx-logo {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 8px;
            color: #ffffff;
            background: linear-gradient(90deg, #ffffff, #f6b179);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: softPulse 2.5s infinite alternate ease-in-out;
        }

        .loader-bar-container {
            width: 120px; height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 25px;
            overflow: hidden;
        }

        .loader-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #f6b179, #a0c4ff);
            animation: loadProgress 2s forwards cubic-bezier(0.65, 0, 0.35, 1);
        }

        @keyframes softPulse {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* ==================== 2. 手機機身與流光背景 ==================== */
        .phone-container {
            width: 380px;
            height: 780px;
            background: #111218;
            border-radius: 54px;
            border: 4px solid #2b2d3d;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(246, 177, 121, 0.08);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 1s ease, transform 1s ease;
        }

        .phone-container.active {
            opacity: 1;
            transform: scale(1);
        }

        /* 溫柔質感壁紙 (柔和溫暖的色彩漸變) */
        .phone-screen {
            width: 100%;
            height: 100%;
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 背景流體柔光球 (模擬高質感光影) */
        .screen-ambient-1 {
            position: absolute;
            top: -50px; right: -50px;
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(246, 177, 121, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .screen-ambient-2 {
            position: absolute;
            bottom: 50px; left: -50px;
            width: 280px; height: 280px;
            background: radial-gradient(circle, rgba(160, 196, 255, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        /* 頂部狀態列與動態島 */
        .status-bar {
            height: 44px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            z-index: 100;
            pointer-events: none;
        }

        .dynamic-island {
            width: 95px;
            height: 22px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }

        /* ==================== 滑動視圖與有機佈局 ==================== */
        .viewport-wrapper {
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .pages-viewport {
            display: flex;
            width: 300%;
            height: 100%;
            will-change: transform;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pages-viewport.dragging {
            transition: none;
        }

        .page {
            width: 33.3333%;
            height: 100%;
            overflow-y: auto;
            padding: 10px 20px 20px 20px;
            scrollbar-width: none;
        }

        .page::-webkit-scrollbar {
            display: none;
        }

        /* ==================== 特殊有機流體卡片 (Fluid Organic Cards) ==================== */
        .card-organic {
            background: var(--glass-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        /* 特殊形狀：非對稱曲線流體膠囊卡片 */
        .card-asymmetric {
            border-radius: 38px 20px 38px 38px;
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.03) 100%);
        }

        .clock-widget .brand-tag {
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--accent-warm);
            margin-bottom: 6px;
        }

        .clock-widget .time {
            font-size: 3.2rem;
            font-weight: 200;
            letter-spacing: -1.5px;
            line-height: 1;
            color: #ffffff;
        }

        .clock-widget .date {
            font-size: 0.82rem;
            color: var(--text-sub);
            margin-top: 8px;
            font-weight: 400;
        }

        /* 非對稱/流動式 App 佈局 (Organic Grid) */
        .app-cluster {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .app-item:active {
            transform: scale(0.9);
        }

        /* 純白柔光 Squircle 圖示 */
        .app-icon {
            width: 62px;
            height: 62px;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px; /* 更圓潤柔和 */
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 6px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
        }

        .app-icon svg {
            width: 25px;
            height: 25px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .app-name {
            font-size: 0.7rem;
            color: var(--text-sub);
            font-weight: 400;
        }

        /* 柔和膠囊分頁指示器 */
        .pagination-dots {
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transition: all 0.35s ease;
        }

        .dot.active {
            width: 20px;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* 底部膠囊 Dock 欄 */
        .dock-container {
            padding: 6px 20px 12px 20px;
            z-index: 10;
        }

        .dock {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 35px;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dock .app-item { margin-bottom: 0; }
        .dock .app-icon {
            margin-bottom: 0;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .home-indicator {
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            margin: 4px auto 6px auto;
        }

        /* 溫和提示彈窗 (Toast) */
        .toast-notification {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 8px 18px;
            font-size: 0.75rem;
            color: #ffffff;
            letter-spacing: 0.5px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 200;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .toast-notification.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

                            <div class="app-item"><div class="app-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><span class="app-name">Chat</span></div>
                            <div class="app-item"><div class="app-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div><span class="app-name">Web</span></div>
                            <div class="app-item"><div class="app-icon"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div><span class="app-name">Lens</span></div>
                        </div>

                        <!-- 聚落式 App 排版 2 -->
                        <div class="app-cluster">
                            <div class="app-item"><div class="app-icon"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></div><span class="app-name">Star</span></div>
                            <div class="app-item"><div class="app-icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><span class="app-name">Audio</span></div>

                <div class="dot" id="dot2"></div>

            <!-- 固定 Dock -->
            <div class="dock-container">
                <div class="dock">
                    <div class="app-item"><div class="app-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div></div>

                    <div class="app-item"><div class="app-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div></div>

    <!-- 腳本控制 -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loader');
            const phone = document.getElementById('phone');
            const viewport = document.getElementById('viewport');
            const wrapper = document.getElementById('viewportWrapper');
            const toast = document.getElementById('toast');

            let currentPage = 1;
            let startX = 0, startY = 0;
            let currentTranslate = -33.3333;
            let prevTranslate = -33.3333;
            let isDragging = false;
            let isHorizontalSwipe = false;

            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                phone.classList.add('active');
                updatePagePosition();
            }, 2000);

            function updatePagePosition() {
                currentTranslate = -currentPage * 33.3333;
                prevTranslate = currentTranslate;
                viewport.style.transform = `translateX(${currentTranslate}%)`;
                
                document.querySelectorAll('.dot').forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentPage);
                });
            }

            function touchStart(e) {
                const touch = e.type.includes('touch') ? e.touches[0] : e;
                startX = touch.clientX;
                startY = touch.clientY;
                isDragging = true;
                isHorizontalSwipe = false;
                viewport.classList.add('dragging');
            }

            function touchMove(e) {
                if (!isDragging) return;
                const touch = e.type.includes('touch') ? e.touches[0] : e;
                const deltaX = touch.clientX - startX;
                const deltaY = touch.clientY - startY;

                if (!isHorizontalSwipe) {
                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 8) {
                        isHorizontalSwipe = true;
                    } else if (Math.abs(deltaY) > Math.abs(deltaX)) {
                        return;
                    }
                }

                if (isHorizontalSwipe) {
                    if (e.cancelable) e.preventDefault();
                    const containerWidth = wrapper.clientWidth;
                    const dragPercent = (deltaX / containerWidth) * 33.3333;
                    viewport.style.transform = `translateX(${prevTranslate + dragPercent}%)`;
                }
            }

            function touchEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                viewport.classList.remove('dragging');

                if (isHorizontalSwipe) {
                    const endX = e.type.includes('touch') ? e.changedTouches[0].clientX : e.clientX;
                    const diffX = startX - endX;

                    if (diffX > 40 && currentPage < 2) {
                        currentPage++;
                    } else if (diffX < -40 && currentPage > 0) {
                        currentPage--;
                    }
                }
                updatePagePosition();
            }

            wrapper.addEventListener('touchstart', touchStart, { passive: true });
            wrapper.addEventListener('touchmove', touchMove, { passive: false });
            wrapper.addEventListener('touchend', touchEnd);

            wrapper.addEventListener('mousedown', touchStart);
            window.addEventListener('mousemove', touchMove);
            window.addEventListener('mouseup', touchEnd);

            // App 保護點擊事件
            document.querySelectorAll('.app-item').forEach(app => {
                app.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toast.classList.add('show');
                    setTimeout(() => toast.classList.remove('show'), 1800);
                });
            });
        });
    </script>
</body>
</html>
