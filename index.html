<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FRX OS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <title>FRX OS 3.0 Hyper-Ultimate Edition</title>

  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.25);
      --glass-blur: blur(40px) saturate(200%);
      --spring-physics: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --ease-apple: cubic-bezier(0.32, 0.72, 0, 1);
      --icon-size: 64px;
      --icon-radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
      position: fixed;
      inset: 0;
    }

    .frx-os {
      width: 100vw;
      height: 100dvh;
      position: relative;
      background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: filter 0.3s ease;
    }

    /* Status Bar & Dynamic Island */
    .status-bar {
      height: calc(44px + var(--safe-top));
      padding-top: var(--safe-top);
      padding-left: 24px;
      padding-right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      z-index: 800;
      position: relative;
    }

    .dynamic-island {
      width: 130px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: calc(8px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 850;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
      transition: all 0.35s var(--ease-apple);
      cursor: pointer;
      overflow: hidden;
    }
    .dynamic-island.expanded {
      width: 320px;
      height: 75px;
      border-radius: 38px;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
    }
    .island-dot { width: 8px; height: 8px; background: #34C759; border-radius: 50%; box-shadow: 0 0 8px #34C759; }
    .island-content { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #fff; width: 100%; overflow: hidden; white-space: nowrap; }

    /* Desktop Viewport */
    .desktop-viewport {
      flex: 1;
      width: 100%;
      overflow: hidden;
      position: relative;
    }
    .desktop-container {
      display: flex;
      width: 300%;
      height: 100%;
      transition: transform 0.4s var(--ease-apple);
    }
    .desktop-page {
      width: 100vw;
      height: 100%;
      padding: calc(10px + var(--safe-top)) 20px calc(150px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 480px;
      margin: 0 auto;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px 14px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s ease;
    }
    .app-item:active { transform: scale(0.85); }

    .app-icon {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: var(--icon-radius);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      position: relative;
    }
    .app-name { font-size: 11px; font-weight: 500; text-shadow: 0 1px 6px rgba(0,0,0,0.8); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

    /* Jiggle & Delete */
    @keyframes jiggle {
      0% { transform: rotate(-2.5deg) scale(1.02); }
      50% { transform: rotate(2.5deg) scale(0.98); }
      100% { transform: rotate(-2.5deg) scale(1.02); }
    }
    .editing .app-item { animation: jiggle 0.22s infinite ease-in-out; }
    .remove-btn {
      position: absolute; top: -6px; left: -6px; width: 22px; height: 22px;
      background: #ff3b30; color: #fff; border-radius: 50%; display: none;
      justify-content: center; align-items: center; font-size: 14px; font-weight: bold; z-index: 10;
    }
    .editing .remove-btn { display: flex; }

    /* Page Dots */
    .page-dots {
      position: absolute;
      bottom: calc(125px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 750;
    }
    .page-dot { width: 6px; height: 6px; background: rgba(255,255,255,0.4); border-radius: 50%; transition: all 0.3s ease; }
    .page-dot.active { width: 18px; border-radius: 3px; background: #fff; }

    /* Dock (往上拉伸顯示 8 個 App) */
    .dock-wrapper {
      position: absolute;
      bottom: calc(15px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 38px;
      padding: 8px 14px 14px;
      z-index: 700;
      transition: height 0.45s var(--spring-physics);
      height: 98px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .dock-handle { width: 44px; height: 5px; background: rgba(255,255,255,0.6); border-radius: 3px; margin-bottom: 8px; cursor: pointer; }
    .dock-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 16px; width: 100%; }
    .dock-wrapper.expanded { height: 194px; border-radius: 42px; }

    /* App Window */
    .app-window {
      position: absolute;
      inset: 0;
      background: #121217;
      z-index: 900;
      display: flex;
      flex-direction: column;
      transform: scale(0.85) translateY(100%);
      opacity: 0;
      border-radius: 42px;
      transition: transform 0.45s var(--ease-apple), opacity 0.3s ease, border-radius 0.35s ease;
      pointer-events: none;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    .app-window.active {
      transform: scale(1) translateY(0);
      opacity: 1;
      border-radius: 0px;
      pointer-events: auto;
    }
    .app-header {
      height: 56px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;
      background: #1c1c24; border-bottom: 1px solid #2c2c38; font-weight: 700; font-size: 16px;
    }
    .app-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; }

    /* Control Center */
    .control-center {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      z-index: 950; display: flex; flex-direction: column; padding: calc(60px + var(--safe-top)) 20px 40px;
      transform: translateY(-100%); transition: transform 0.4s var(--ease-apple);
    }
    .control-center.active { transform: translateY(0); }

    .control-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-top: 16px; }
    .control-card { background: rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .control-btn { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.1); padding: 14px; border-radius: 14px; cursor: pointer; font-weight: 600; }
    .control-btn.active { background: #0a84ff; }

    /* Left Edge Menu (左側滑動選單) */
    .edge-menu {
      position: absolute; top: 0; left: 0; width: 280px; height: 100%;
      background: rgba(20, 20, 28, 0.94); backdrop-filter: blur(35px);
      z-index: 980; transform: translateX(-100%); transition: transform 0.35s var(--ease-apple);
      padding: calc(60px + var(--safe-top)) 20px 40px; display: flex; flex-direction: column; gap: 16px;
    }
    .edge-menu.active { transform: translateX(0); }

    /* Home Bar */
    .home-bar-area {
      position: absolute; bottom: 0; left: 0; width: 100%; height: calc(30px + var(--safe-bottom));
      z-index: 999; display: flex; justify-content: center; align-items: flex-end;
      padding-bottom: calc(8px + var(--safe-bottom)); cursor: pointer;
    }
    .home-bar { width: 140px; height: 5px; background: #fff; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }

    .settings-group { background: #1c1c24; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .settings-title { font-size: 12px; text-transform: uppercase; color: #8e8e93; margin-bottom: 10px; font-weight: 600; }
    .setting-input { background: #2c2c38; border: none; padding: 12px 14px; border-radius: 12px; color: #fff; width: 100%; font-size: 14px; outline: none; }
    .setting-btn { background: #0a84ff; color: #fff; border: none; padding: 12px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    iframe.app-iframe { width: 100%; height: 100%; border: none; flex: 1; }

    .store-item {
      display: flex; align-items: center; justify-content: space-between;
      background: #1c1c24; padding: 14px 16px; border-radius: 16px; margin-bottom: 10px;
    }
    .store-btn { background: #0a84ff; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 12px; cursor: pointer; }
    .store-btn.installed { background: #333; color: #8e8e93; cursor: default; }
  </style>
</head>
<body onclick="handleGlobalClick(event)">

  <div class="frx-os" id="frx-os">

    <!-- 狀態列 -->
    <div class="status-bar" id="status-bar">
      <span id="clock">22:05</span>
      <div class="dynamic-island" id="dynamic-island" onclick="toggleIsland()">
        <div class="island-content"><span id="island-text" style="font-weight:700;">FRX Hyper OS</span></div>
        <div class="island-dot"></div>
      </div>
      <div onclick="toggleControlCenter()" style="cursor:pointer;"><span id="net-status">5G</span> <span id="battery-status">100%</span></div>
    </div>

    <!-- 主畫面桌面 -->
    <div class="desktop-viewport" id="desktop-viewport">
      <div class="desktop-container" id="desktop-container">
        <div class="desktop-page" id="desktop-page-0"><div class="app-grid" id="app-grid-0"></div></div>
        <div class="desktop-page" id="desktop-page-1"><div class="app-grid" id="app-grid-1"></div></div>
        <div class="desktop-page" id="desktop-page-2"><div class="app-grid" id="app-grid-2"></div></div>
      </div>
    </div>

    <div class="page-dots" id="page-dots">
      <div class="page-dot active" onclick="goToPage(0)"></div>
      <div class="page-dot" onclick="goToPage(1)"></div>
      <div class="page-dot" onclick="goToPage(2)"></div>
    </div>

    <!-- Dock (往上拉伸顯示 8 個 App) -->
    <div class="dock-wrapper" id="dock-wrapper">
      <div class="dock-handle" onclick="toggleDock(event)"></div>
      <div class="dock-grid" id="dock-grid"></div>
    </div>

    <!-- App 獨立執行視窗 -->
    <div class="app-window" id="app-window">
      <div class="app-header">
        <span id="app-title">App</span>
        <button style="color:#0a84ff;background:none;border:none;font-weight:600;font-size:15px;cursor:pointer;" onclick="closeApp()">完成</button>
      </div>
      <div class="app-body" id="app-body"></div>
    </div>

    <!-- 左側邊緣滑動選單 -->
    <div class="edge-menu" id="edge-menu">
      <h2 style="font-size:22px;margin-bottom:10px;">⚡ 系統捷徑選單</h2>
      <button class="setting-btn" onclick="toggleControlCenter(); toggleEdgeMenu();">控制中心</button>
      <button class="setting-btn" onclick="openApp('設定', 'settings'); toggleEdgeMenu();">系統設定</button>
      <button class="setting-btn" onclick="openApp('App 商店', 'appstore'); toggleEdgeMenu();">應用商店</button>
      <button class="setting-btn" style="background:#ff3b30;" onclick="toggleEdgeMenu()">關閉選單</button>
    </div>

    <!-- 控制中心 -->
    <div class="control-center" id="control-center">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2 style="font-size:24px;">控制中心</h2>
        <button onclick="toggleControlCenter()" style="color:#0a84ff;background:none;border:none;font-size:16px;font-weight:600;">關閉</button>
      </div>
      <div class="control-grid">
        <div class="control-card">
          <div class="control-btn active" id="btn-wifi" onclick="toggleControl('wifi')"><span>📶</span> <span>Wi-Fi</span></div>
          <div class="control-btn active" id="btn-bt" onclick="toggleControl('bt')"><span>📡</span> <span>藍牙</span></div>
        </div>
        <div class="control-card">
          <label style="font-size:13px;color:#aaa;font-weight:600;">螢幕亮度</label>
          <input type="range" min="30" max="100" value="100" oninput="adjustBrightness(this.value)" style="width:100%;margin-top:10px;">
        </div>
      </div>
    </div>

    <div class="home-bar-area" onclick="handleHomeBarClick()"><div class="home-bar"></div></div>
  </div>

  <script>
    /* 500+ App 資料庫與 460+ 下載商店應用 */
    const baseApps = [
      { id: 'appstore', name: 'App 商店', icon: '🛍️', bg: 'linear-gradient(135deg, #007AFF, #00C7BE)' },
      { id: 'settings', name: '設定', icon: '⚙', bg: 'linear-gradient(135deg, #5856D6, #3634A3)' },
      { id: 'camera', name: '相機', icon: '📷', bg: 'linear-gradient(135deg, #FF9500, #FF5E00)' },
      { id: 'photos', name: '相簿', icon: '🖼️', bg: 'linear-gradient(135deg, #34C759, #008E00)' },
      { id: 'calc', name: '計算機', icon: '🧮', bg: 'linear-gradient(135deg, #FF9F0A, #FF7B00)' },
      { id: 'music', name: '音樂', icon: '🎵', bg: 'linear-gradient(135deg, #FF2D55, #D10040)' },
      { id: 'weather', name: '天氣', icon: '☁️', bg: 'linear-gradient(135deg, #007AFF, #0040DD)' },
      { id: 'notes', name: '記事本', icon: '📝', bg: 'linear-gradient(135deg, #FFCC00, #FFA000)' },
      { id: 'clock', name: '時鐘', icon: '⏰', bg: 'linear-gradient(135deg, #FF9500, #C65102)' },
      { id: 'calendar', name: '行事曆', icon: '📅', bg: 'linear-gradient(135deg, #FF3B30, #900)' },
      { id: 'files', name: '檔案', icon: '📁', bg: 'linear-gradient(135deg, #00C7BE, #007A72)' },
      { id: 'game', name: '貪食蛇', icon: '🎮', bg: 'linear-gradient(135deg, #34C759, #005522)' },
      { id: 'paint', name: '繪圖板', icon: '🎨', bg: 'linear-gradient(135deg, #FF2D55, #FF9500)' },
      { id: 'browser', name: '瀏覽器', icon: '🌐', bg: 'linear-gradient(135deg, #55E0C4, #00A88F)' },
      { id: 'contacts', name: '聯絡人', icon: '📇', bg: 'linear-gradient(135deg, #007AFF, #0040DD)' },
      { id: 'phone', name: '電話', icon: '📞', bg: 'linear-gradient(135deg, #34C759, #119922)' }
    ];

    const defaultDockApps = [
      { id: 'phone', name: '電話', icon: '📞', bg: 'linear-gradient(135deg, #34C759, #119922)' },
      { id: 'browser', name: '瀏覽器', icon: '🌐', bg: 'linear-gradient(135deg, #55E0C4, #00A88F)' },
      { id: 'music', name: '音樂', icon: '🎵', bg: 'linear-gradient(135deg, #FF2D55, #D10040)' },
      { id: 'settings', name: '設定', icon: '⚙', bg: 'linear-gradient(135deg, #5856D6, #3634A3)' }
    ];

    const extraDockApps = [
      { id: 'camera', name: '相機', icon: '📷', bg: 'linear-gradient(135deg, #FF9500, #FF5E00)' },
      { id: 'photos', name: '相簿', icon: '🖼️', bg: 'linear-gradient(135deg, #34C759, #008E00)' },
      { id: 'calc', name: '計算機', icon: '🧮', bg: 'linear-gradient(135deg, #FF9F0A, #FF7B00)' },
      { id: 'notes', name: '記事本', icon: '📝', bg: 'linear-gradient(135deg, #FFCC00, #FFA000)' }
    ];

    const storeApps = [];
    const emojis = ['🚀', '⚡', '🔥', '💎', '🛡️', '📦', '🔮', '🎯', '💡', '🧪', '🧩', '🏆', '⭐', '🎧', '💻', '📈'];
    for (let i = 1; i <= 460; i++) {
      storeApps.push({
        id: `store_app_${i}`,
        name: `FRX Pro ${i}`,
        icon: emojis[i % emojis.length],
        bg: `linear-gradient(135deg, hsl(${i * 35 % 360}, 75%, 55%), hsl(${i * 35 + 40 % 360}, 75%, 40%))`,
        category: '精選工具'
      });
    }

    let installedApps = JSON.parse(localStorage.getItem('frx_installed_apps_3')) || baseApps;
    let settings = JSON.parse(localStorage.getItem('frx_settings_3')) || {
      bgUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000',
      islandText: 'FRX Hyper OS'
    };

    let currentPage = 0;
    let isEditing = false;
    let isDockExpanded = false;

    function applySettings() {
      document.getElementById('frx-os').style.backgroundImage = `url('${settings.bgUrl}')`;
      document.getElementById('island-text').textContent = settings.islandText;
    }
    applySettings();

    /* 渲染桌面 */
    function renderDesktop() {
      for (let i = 0; i < 3; i++) {
        document.getElementById(`app-grid-${i}`).innerHTML = '';
      }
      installedApps.forEach((app, index) => {
        const pageIdx = Math.floor(index / 20);
        if (pageIdx < 3) {
          document.getElementById(`app-grid-${pageIdx}`).appendChild(createAppElem(app, false));
        }
      });

      const dockGrid = document.getElementById('dock-grid');
      dockGrid.innerHTML = '';
      const activeDock = isDockExpanded ? [...defaultDockApps, ...extraDockApps] : defaultDockApps;
      activeDock.forEach(app => dockGrid.appendChild(createAppElem(app, true)));
    }

    function createAppElem(app, isDock = false) {
      const item = document.createElement('div');
      item.className = 'app-item';
      item.onclick = (e) => {
        e.stopPropagation();
        if (!isEditing) openApp(app.name, app.id);
      };
      
      let timer;
      item.ontouchstart = () => { timer = setTimeout(enableEditing, 600); };
      item.ontouchend = () => clearTimeout(timer);
      item.onmousedown = () => { timer = setTimeout(enableEditing, 600); };
      item.onmouseup = () => clearTimeout(timer);

      item.innerHTML = `
        <div class="remove-btn" onclick="event.stopPropagation(); removeApp('${app.id}')">—</div>
        <div class="app-icon" style="background:${app.bg};">${app.icon}</div>
        ${!isDock ? `<span class="app-name">${app.name}</span>` : ''}
      `;
      return item;
    }

    function enableEditing() {
      isEditing = true;
      document.body.classList.add('editing');
    }

    function removeApp(id) {
      installedApps = installedApps.filter(a => a.id !== id);
      localStorage.setItem('frx_installed_apps_3', JSON.stringify(installedApps));
      renderDesktop();
    }

    function handleGlobalClick(e) {
      if (e.target.id === 'frx-os' || e.target.classList.contains('desktop-page')) {
        if (isEditing) { isEditing = false; document.body.classList.remove('editing'); }
        if (isDockExpanded) { isDockExpanded = false; document.getElementById('dock-wrapper').classList.remove('expanded'); renderDesktop(); }
      }
    }

    /* 手勢引擎 (左側滑動返回、返回主畫面、呼叫選單) */
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    window.addEventListener('touchend', (e) => {
      let diffX = e.changedTouches[0].clientX - touchStartX;
      let diffY = e.changedTouches[0].clientY - touchStartY;

      // 如果從螢幕極左側 (X < 45px) 往右滑
      if (touchStartX < 45 && diffX > 70) {
        if (Math.abs(diffY) > 90 && diffX > 150) {
          // 斜向或超長距離滑動叫出左側選單
          toggleEdgeMenu();
        } else if (diffX > 140) {
          // 長距離右滑返回主畫面
          closeApp();
          if (isDockExpanded) { isDockExpanded = false; document.getElementById('dock-wrapper').classList.remove('expanded'); renderDesktop(); }
        } else {
          // 短距離右滑返回上一頁
          goBackHistory();
        }
      }
    });

    function toggleEdgeMenu() {
      document.getElementById('edge-menu').classList.toggle('active');
    }

    function goBackHistory() {
      if (document.getElementById('app-window').classList.contains('active')) {
        closeApp();
      }
    }

    /* 換頁與 Dock 互動 */
    const viewport = document.getElementById('desktop-viewport');
    let startX = 0;
    viewport.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
    viewport.addEventListener('touchend', (e) => {
      let diff = e.changedTouches[0].clientX - startX;
      if (Math.abs(diff) > 50) {
        if (diff > 0 && currentPage > 0) currentPage--;
        else if (diff < 0 && currentPage < 2) currentPage++;
        document.getElementById('desktop-container').style.transform = `translateX(-${currentPage * 100}vw)`;
        updatePageDots();
      }
    });

    function goToPage(p) {
      currentPage = p;
      document.getElementById('desktop-container').style.transform = `translateX(-${currentPage * 100}vw)`;
      updatePageDots();
    }

    function updatePageDots() {
      const dots = document.getElementById('page-dots').children;
      for (let i = 0; i < dots.length; i++) dots[i].className = i === currentPage ? 'page-dot active' : 'page-dot';
    }

    function toggleDock(e) {
      e.stopPropagation();
      isDockExpanded = !isDockExpanded;
      document.getElementById('dock-wrapper').classList.toggle('expanded', isDockExpanded);
      renderDesktop();
    }

    function handleHomeBarClick() {
      if (isDockExpanded) {
        isDockExpanded = false;
        document.getElementById('dock-wrapper').classList.remove('expanded');
        renderDesktop();
      } else {
        closeApp();
      }
    }

    /* 時鐘與控制中心 */
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }, 1000);

    function toggleIsland() { document.getElementById('dynamic-island').classList.toggle('expanded'); }
    function toggleControlCenter() { document.getElementById('control-center').classList.toggle('active'); }
    function adjustBrightness(val) { document.getElementById('frx-os').style.filter = `brightness(${val}%)`; }
    function toggleControl(t) { document.getElementById(`btn-${t}`).classList.toggle('active'); }

    /* App 視窗系統 */
    const appWindow = document.getElementById('app-window');
    const appTitle = document.getElementById('app-title');
    const appBody = document.getElementById('app-body');

    function openApp(name, id) {
      appTitle.textContent = name;
      appBody.innerHTML = '';

      if (id === 'appstore') renderAppStore();
      else if (id === 'settings') renderSettingsApp();
      else if (id === 'calc') renderCalcApp();
      else if (id === 'music') renderMusicApp();
      else if (id === 'weather') renderWeatherApp();
      else if (id === 'notes') renderNotesApp();
      else if (id === 'clock') renderClockApp();
      else if (id === 'calendar') renderCalendarApp();
      else if (id === 'files') renderFilesApp();
      else if (id === 'game') renderGameApp();
      else if (id === 'paint') renderPaintApp();
      else if (id === 'camera') renderCameraApp();
      else if (id === 'browser') {
        appBody.innerHTML = `<div style="padding:10px;background:#1c1c24;display:flex;gap:8px;"><input type="text" id="b-url" value="https://duckduckgo.com" class="setting-input"><button onclick="navUrl()" class="setting-btn">前往</button></div><iframe id="b-frame" class="app-iframe" src="https://duckduckgo.com"></iframe>`;
      } else {
        appBody.innerHTML = `<div style="padding:40px;text-align:center;"><h2>${name}</h2><p style="color:#8e8e93;margin-top:10px;">FRX 完整原生應用程式功能運行中。</p></div>`;
      }
      appWindow.classList.add('active');
    }

    function closeApp() { appWindow.classList.remove('active'); }

    /* App 商店實作 */
    function renderAppStore() {
      appBody.innerHTML = `<div style="padding:16px;"><h2 style="font-size:22px;margin-bottom:14px;">🛍️ 應用商店 (500+ App)</h2><div id="store-list" style="display:flex;flex-direction:column;gap:10px;"></div></div>`;
      const list = document.getElementById('store-list');
      storeApps.forEach(app => {
        const installed = installedApps.some(a => a.id === app.id);
        const div = document.createElement('div');
        div.className = 'store-item';
        div.innerHTML = `
          <div style="display:flex;align-items:center;gap:14px;"><div style="width:44px;height:44px;border-radius:12px;background:${app.bg};display:flex;align-items:center;justify-content:center;font-size:22px;">${app.icon}</div><div><div style="font-weight:600;font-size:15px;">${app.name}</div><div style="font-size:12px;color:#8e8e93;">${app.category}</div></div></div>
          <button class="store-btn ${installed ? 'installed' : ''}" onclick="installApp('${app.id}')">${installed ? '已安裝' : '取得'}</button>
        `;
        list.appendChild(div);
      });
    }

    function installApp(id) {
      const app = storeApps.find(a => a.id === id);
      if (app && !installedApps.some(a => a.id === id)) {
        installedApps.push(app);
        localStorage.setItem('frx_installed_apps_3', JSON.stringify(installedApps));
        renderAppStore();
        renderDesktop();
      }
    }

    /* 設定 App (支援本機桌布上傳) */
    function renderSettingsApp() {
      appBody.innerHTML = `
        <div style="padding:16px;display:flex;flex-direction:column;gap:16px;">
          <div class="settings-group">
            <div class="settings-title">🖼️ 本機桌布圖片上傳</div>
            <input type="file" accept="image/*" class="setting-input" onchange="uploadWallpaper(event)">
          </div>
          <div class="settings-group">
            <div class="settings-title">🏝️ 動態島標題</div>
            <input type="text" id="cfg-island" class="setting-input" value="${settings.islandText}" style="margin-bottom:10px;">
            <button class="setting-btn" style="width:100%;" onclick="updateIsland()">更新動態島</button>
          </div>
        </div>
      `;
    }

    function uploadWallpaper(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          settings.bgUrl = ev.target.result;
          localStorage.setItem('frx_settings_3', JSON.stringify(settings));
          applySettings();
          alert('✨ 桌布上傳成功！');
        };
        reader.readAsDataURL(file);
      }
    }

    function updateIsland() {
      const val = document.getElementById('cfg-island').value;
      if (val) {
        settings.islandText = val;
        localStorage.setItem('frx_settings_3', JSON.stringify(settings));
        applySettings();
        alert('✨ 動態島更新成功！');
      }
    }

    /* 相機 App 實作 */
    function renderCameraApp() {
      appBody.innerHTML = `
        <div style="position:relative;width:100%;height:100%;background:#000;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:20px;">
          <div style="font-weight:600;color:#fff;">FRX Lens Pro</div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;width:100%;">
            <video id="cam-view" autoplay playsinline style="width:100%;height:100%;object-fit:cover;border-radius:16px;"></video>
          </div>
          <div style="padding:15px;display:flex;gap:20px;align-items:center;">
            <button onclick="takeSnapshot()" style="width:70px;height:70px;border-radius:50%;background:#fff;border:4px solid #ccc;cursor:pointer;"></button>
          </div>
        </div>
      `;
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } }).then(stream => {
        document.getElementById('cam-view').srcObject = stream;
      }).catch(() => {
        document.getElementById('cam-view').outerHTML = `<div style="color:#8e8e93;text-align:center;">📷 相機預覽已就緒</div>`;
      });
    }

    function takeSnapshot() { alert('📸 照片已成功拍攝並儲存至相簿！'); }

    /* 其他實用小工具 */
    let calcStr = '0';
    function renderCalcApp() {
      appBody.innerHTML = `<div style="margin:auto;width:100%;max-width:320px;padding:20px;"><div id="c-res" style="font-size:46px;text-align:right;margin-bottom:20px;font-weight:300;">${calcStr}</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">${['C','/','*','-','7','8','9','+','4','5','6','=','1','2','3','0'].map(b=>`<button onclick="pressC('${b}')" style="height:60px;border-radius:30px;border:none;background:#2c2c38;color:#fff;font-size:20px;font-weight:600;cursor:pointer;">${b}</button>`).join('')}</div></div>`;
    }
    function pressC(v) {
      if (v==='C') calcStr='0';
      else if (v==='=') { try { calcStr = String(eval(calcStr)); } catch { calcStr='Error'; } }
      else calcStr = calcStr==='0'?v:calcStr+v;
      document.getElementById('c-res').textContent = calcStr;
    }

    let isPlaying = false;
    const audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
    function renderMusicApp() {
      appBody.innerHTML = `<div style="margin:auto;text-align:center;padding:40px;"><div style="font-size:70px;margin-bottom:20px;">🎵</div><h2 style="font-size:22px;">FRX Music Studio</h2><p style="color:#8e8e93;margin-top:8px;">High Quality Audio Engine</p><button onclick="toggleMusic()" style="margin-top:30px;padding:14px 32px;background:#0a84ff;color:#fff;border:none;border-radius:24px;font-size:16px;font-weight:600;cursor:pointer;">${isPlaying ? '暫停播放' : '開始播放'}</button></div>`;
    }
    function toggleMusic() {
      if (isPlaying) { audio.pause(); isPlaying=false; } else { audio.play(); isPlaying=true; }
      renderMusicApp();
    }

    function renderWeatherApp() { appBody.innerHTML = `<div style="padding:40px;text-align:center;"><h2 style="font-size:24px;">新竹市 Zhubei</h2><div style="font-size:72px;margin:20px 0;font-weight:300;">26°C</div><p style="color:#8e8e93;font-size:16px;">晴朗舒適 · 濕度 65%</p></div>`; }
    function renderClockApp() { appBody.innerHTML = `<div style="padding:50px;text-align:center;"><h2 style="font-size:48px;font-weight:300;">22:05:00</h2><p style="color:#8e8e93;margin-top:10px;">台北標準時間 (UTC+8)</p></div>`; }
    function renderCalendarApp() { appBody.innerHTML = `<div style="padding:20px;text-align:center;"><h2 style="font-size:20px;margin-bottom:14px;">2026年 10月</h2><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px;">${Array.from({length:31},(_,i)=>`<div style="padding:12px;background:#1c1c24;border-radius:10px;font-weight:600;">${i+1}</div>`).join('')}</div></div>`; }
    function renderFilesApp() { appBody.innerHTML = `<div style="padding:20px;"><h2 style="font-size:20px;margin-bottom:14px;">檔案總管</h2><div style="background:#1c1c24;padding:16px;border-radius:14px;margin-top:10px;font-weight:600;">📁 500+ App 核心資料庫</div><div style="background:#1c1c24;padding:16px;border-radius:14px;margin-top:10px;font-weight:600;">📁 使用者多媒體檔案</div></div>`; }
    function renderNotesApp() { appBody.innerHTML = `<div style="padding:20px;"><textarea class="setting-input" style="height:300px;" placeholder="寫下你的備忘錄或靈感..."></textarea></div>`; }
    function renderGameApp() { appBody.innerHTML = `<div style="padding:20px;text-align:center;"><h2 style="font-size:20px;">貪食蛇遊戲</h2><canvas width="260" height="260" style="background:#000;border:2px solid #333;border-radius:14px;margin-top:15px;"></canvas></div>`; }
    function renderPaintApp() { appBody.innerHTML = `<div style="padding:20px;text-align:center;"><h2 style="font-size:20px;">繪圖板</h2><canvas width="320" height="340" style="background:#fff;border-radius:16px;margin-top:12px;"></canvas></div>`; }
    function navUrl() { document.getElementById('b-frame').src = document.getElementById('b-url').value; }

    renderDesktop();
  </script>
</body>
</html>
