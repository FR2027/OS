<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Next-Gen Edge Flow OS</title>
    <style>
        :root {
            --glass-bg: rgba(22, 26, 38, 0.65);
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-orange: #ff7e5f;
            --accent-cyan: #00f2fe;
            --accent-blue: #3a7bd5;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #05070c;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 手機外殼 */
        .phone-container {
            width: 380px;
            height: 780px;
            background: #000;
            border-radius: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8), 0 20px 80px rgba(58, 123, 213, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* 螢幕背景與桌布 */
        .phone-screen {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, #3a2218 0%, #0d1117 70%);
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 16px 20px;
        }

        /* 桌布漸層流體背景 */
        .wallpaper-fluid {
            position: absolute;
            top: 20%;
            left: -20%;
            width: 140%;
            height: 50%;
            background: linear-gradient(135deg, rgba(255, 126, 95, 0.4), rgba(0, 242, 254, 0.25));
            filter: blur(60px);
            border-radius: 50%;
            pointer-events: none;
        }

        /* 頂部狀態列 */
        .status-bar {
            height: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 10;
        }

        /* 側邊直立式 Dock (右側) */
        .side-dock {
            position: absolute;
            right: 14px;
            top: 18%;
            width: 58px;
            background: rgba(18, 22, 32, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 16px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            z-index: 50;
            box-shadow: -5px 10px 30px rgba(0,0,0,0.5);
        }

        .dock-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .dock-icon:active {
            transform: scale(0.8);
            background: var(--accent-orange);
        }

        .dock-icon svg {
            width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2;
        }

        /* 左側與中央卡片區域 */
        .main-content {
            width: calc(100% - 68px);
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 20;
            overflow-y: auto;
            scrollbar-width: none;
            height: 100%;
            padding-bottom: 40px;
        }
        .main-content::-webkit-scrollbar { display: none; }

        /* Now Flow 卡片模組 */
        .now-flow-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .now-flow-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .flow-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .flow-card:active { transform: scale(0.97); }

        .card-icon {
            width: 36px; height: 36px;
            border-radius: 12px;
            background: rgba(255,255,255,0.12);
            display: flex; justify-content: center; align-items: center;
        }

        .card-info { flex: 1; }
        .card-title { font-size: 0.85rem; font-weight: 600; }
        .card-sub { font-size: 0.72rem; color: var(--text-sub); margin-top: 2px; }

        /* 大型音樂播放卡片 */
        .music-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .music-card:active { transform: scale(0.98); }

        .music-visual {
            width: 100%;
            height: 90px;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .wave-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .wave-bar {
            width: 4px;
            height: 20px;
            background: var(--accent-orange);
            border-radius: 2px;
            animation: waveAnim 1s infinite alternate ease-in-out;
        }
        .wave-bar:nth-child(2n) { animation-delay: 0.2s; background: var(--accent-cyan); }
        .wave-bar:nth-child(3n) { animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { height: 10px; }
            100% { height: 45px; }
        }

        .music-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .play-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--text-main);
            color: #000;
            display: flex; justify-content: center; align-items: center;
        }

        /* 系統互動 Modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 250px;
            background: rgba(28, 32, 48, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 22px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transform: scale(0.9);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-card { transform: scale(1); }

        .modal-title { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
        .modal-desc { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 18px; }

        .modal-btn {
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-cyan));
            color: #fff;
            font-weight: 600;
            border: none;
            padding: 9px 0;
            width: 100%;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="phone-screen">
            <div class="wallpaper-fluid"></div>

            <!-- 狀態列 -->
            <div class="status-bar">
                <span>10:08</span>
                <span style="color:var(--accent-cyan);">95% ⚡</span>
            </div>

            <!-- 右側直立式 Dynamic Dock -->
            <div class="side-dock">
                <div class="dock-icon trigger-btn"><svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></div>
                <div class="dock-icon trigger-btn"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></div>
                <div class="dock-icon trigger-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
                <div class="dock-icon trigger-btn"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
                <div class="dock-icon trigger-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
            </div>

            <!-- 主動態卡片區塊 -->
            <div class="main-content">
                
                <div class="now-flow-header">
                    <div class="now-flow-title">Now Flow</div>
                    <span style="font-size:0.75rem; color:var(--text-sub);">12:08 AM</span>
                </div>

                <!-- 卡片 1: 行程 -->
                <div class="flow-card trigger-btn">
                    <div class="card-icon">📅</div>
                    <div class="card-info">
                        <div class="card-title">Meeting in 15 mins</div>
                        <div class="card-sub">Design Review with Team</div>
                    </div>
                </div>

                <!-- 卡片 2: 天氣 -->
                <div class="flow-card trigger-btn">
                    <div class="card-icon">☀️</div>
                    <div class="card-info">
                        <div class="card-title">Sunny 24°C</div>
                        <div class="card-sub">Taoyuan City, Taiwan</div>
                    </div>
                </div>

                <!-- 卡片 3: 大型音樂動態卡片 -->
                <div class="music-card trigger-btn">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:0.75rem; color:var(--accent-orange); font-weight:600;">NOW PLAYING</span>
                        <span style="font-size:0.7rem; color:var(--text-sub);">Spotify</span>
                    </div>

                    <div class="music-visual">
                        <div class="wave-container">
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                        </div>
                    </div>

                    <div>
                        <div style="font-size:1rem; font-weight:600;">Arctic Monkeys</div>
                        <div style="font-size:0.8rem; color:var(--text-sub); margin-top:2px;">Do I Wanna Know?</div>
                    </div>

                    <div class="music-controls">
                        <span style="font-size:1.2rem;">⏮</span>
                        <div class="play-btn">▶</div>
                        <span style="font-size:1.2rem;">⏭</span>
                    </div>
                </div>

                <!-- 卡片 4: 訊息通知 -->
                <div class="flow-card trigger-btn">
                    <div class="card-icon">💬</div>
                    <div class="card-info">
                        <div class="card-title">From Sarah</div>
                        <div class="card-sub">See you soon!</div>
                    </div>
                </div>

            </div>

            <!-- 系統點擊 Modal -->
            <div class="modal-overlay" id="modal">
                <div class="modal-card">
                    <div class="modal-title">Edge Flow OS</div>
                    <div class="modal-desc">暫時不支援預覽</div>
                    <button class="modal-btn" onclick="closeModal()">確定</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const modal = document.getElementById('modal');

        document.querySelectorAll('.trigger-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                modal.classList.add('show');
            });
        });

        function closeModal() {
            modal.classList.remove('show');
        }
    </script>
</body>
</html>
