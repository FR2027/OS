<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- iOS PWA 滿版與 Safari 全螢幕適配 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FRX OS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">

  <!-- PWA 圖示修復（圖片置中不裁切） -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/0RHgQJcw/Background-Eraser.png">
  <link rel="icon" type="image/png" sizes="32x32" href="https://i.ibb.co/0RHgQJcw/Background-Eraser.png">
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkZSWCBPUyAxIiwKICAic2hvcnRfbmFtZSI6ICJGUlhPUyIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMDAwMDAwIiwKICAidGhlbWVfY29sb3IiOiAiIzAwMDAwMCIsCiAgImljb25zIjogWwogICAgewogICAgICAic3JjIjogImh0dHBzOi8vaS5pYmIuY28vMFJIZ1FKY3cvQmFja2dyb3VuZC1FcmFzZXIucG5nIiwKICAgICAgInNpemVzIjogIjUxMng1MTIiLAogICAgICAidHlwZSI6ICJpbWFnZS9wbmc2NAiCiAgICB9CiAgXQp9">

  <title>FRX OS 1 Ultra Lock & Swipable</title>

  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      --glass-bg: rgba(255, 255, 255, 0.18);
      --glass-border: rgba(255, 255, 255, 0.28);
      --glass-blur: blur(35px) saturate(200%);
      --ease-apple: cubic-bezier(0.32, 0.72, 0, 1);
      --spring-physics: cubic-bezier(0.175, 0.885, 0.32, 1.275);
      --icon-size: 60px;
      --icon-radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
      position: fixed;
    }

    /* OS 全域系統底圖 */
    .frx-os {
      width: 100vw;
      height: 100dvh;
      position: relative;
      background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: filter 0.3s ease, transform 0.3s ease;
    }

    /* 頂部 StatusBar & 動態島 */
    .status-bar {
      height: calc(44px + var(--safe-top));
      padding: var(--safe-top) 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      z-index: 1000;
      pointer-events: auto;
    }

    .dynamic-island {
      width: 125px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: calc(8px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 1050;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
      transition: all 0.35s var(--ease-apple);
      cursor: pointer;
      overflow: hidden;
    }
    .dynamic-island.expanded {
      width: 310px;
      height: 75px;
      border-radius: 38px;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(20px);
    }
    .island-dot { width: 8px; height: 8px; background: #34C759; border-radius: 50%; box-shadow: 0 0 8px #34C759; flex-shrink: 0; }
    .island-content { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #fff; width: 100%; overflow: hidden; white-space: nowrap; }

    /* 🔒 全螢幕鎖定畫面 (Lockscreen) */
    .lock-screen {
      position: absolute;
      inset: 0;
      background-image: inherit;
      background-size: cover;
      background-position: center;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(60px + var(--safe-top)) 30px calc(40px + var(--safe-bottom));
      backdrop-filter: blur(0px);
      transition: transform 0.45s var(--ease-apple), backdrop-filter 0.3s ease, opacity 0.35s ease;
    }
    .lock-screen.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .lock-screen.show-passcode {
      backdrop-filter: blur(25px) brightness(0.7);
    }

    .lock-clock-box { text-align: center; }
    .lock-time { font-size: 76px; font-weight: 200; letter-spacing: -2px; }
    .lock-date { font-size: 18px; font-weight: 500; opacity: 0.85; margin-top: -6px; }

    /* 解鎖密碼鍵盤盤面 */
    .passcode-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.35s ease;
      pointer-events: none;
    }
    .lock-screen.show-passcode .passcode-container {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .lock-screen.show-passcode .lock-clock-box { display: none; }

    .passcode-dots { display: flex; gap: 16px; margin-bottom: 10px; }
    .pass-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; transition: background 0.2s; }
    .pass-dot.filled { background: #fff; }

    .passcode-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 280px; }
    .pass-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.2); border: none; color: #fff; font-size: 26px; font-weight: 400; display: flex; align-items: center; justify-content: center; margin: 0 auto; cursor: pointer; }
    .pass-btn:active { background: rgba(255,255,255,0.4); }

    .lock-bottom-actions { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .lock-quick-btn { width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }

    /* 📱 可左右滑動的分頁桌面容器 */
    .paged-desktop {
      flex: 1;
      display: flex;
      width: 200%; /* 2 個分頁 */
      height: 100%;
      transition: transform 0.35s var(--ease-apple);
      will-change: transform;
    }

    .desktop-page {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: calc(10px + var(--safe-top)) 20px calc(130px + var(--safe-bottom));
      gap: 20px;
      max-width: 480px;
      margin: 0 auto;
      overflow-y: auto;
    }

    /* 桌面分頁指示點 */
    .page-dots {
      position: absolute;
      bottom: calc(115px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 600;
    }
    .p-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.4); transition: all 0.3s; }
    .p-dot.active { background: #fff; width: 18px; border-radius: 4px; }

    /* 橫幅 Widget */
    .widget-banner {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
    }
    .widget-img-container {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .widget-img-container img { width: 85%; height: 85%; object-fit: contain; object-position: center; }

    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 14px; }
    .app-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; transition: transform 0.2s; }
    .app-item:active { transform: scale(0.88); }
    .app-icon { width: var(--icon-size); height: var(--icon-size); border-radius: var(--icon-radius); display: flex; justify-content: center; align-items: center; font-size: 28px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); position: relative; }
    .app-name { font-size: 11px; font-weight: 500; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

    /* iOS 搖晃編輯模式 */
    @keyframes jiggle { 0% { transform: rotate(-1.8deg) scale(1.02); } 50% { transform: rotate(1.8deg) scale(0.98); } 100% { transform: rotate(-1.8deg) scale(1.02); } }
    .editing .app-item { animation: jiggle 0.22s infinite ease-in-out; }
    .remove-btn { position: absolute; top: -6px; left: -6px; width: 22px; height: 22px; background: #ff3b30; color: #fff; border-radius: 50%; display: none; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; z-index: 10; }
    .editing .remove-btn { display: flex; }

    /* Dock 欄 */
    .dock-wrapper {
      position: absolute;
      bottom: calc(15px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 38px;
      padding: 8px 14px 12px;
      z-index: 700;
      transition: height 0.42s var(--spring-physics), border-radius 0.3s ease;
      height: 94px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    .dock-handle { width: 42px; height: 5px; background: rgba(255,255,255,0.6); border-radius: 3px; margin-bottom: 8px; cursor: grab; }
    .dock-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 16px; width: 100%; }
    .dock-wrapper.expanded { height: 184px; border-radius: 42px; }

    /* 全螢幕 App 視窗 */
    .app-window {
      position: absolute;
      inset: 0;
      background: #121217;
      z-index: 900;
      display: flex;
      flex-direction: column;
      transform: scale(0.85) translateY(100%);
      opacity: 0;
      border-radius: 42px;
      transition: transform 0.45s var(--ease-apple), opacity 0.3s ease, border-radius 0.35s ease;
      pointer-events: none;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    .app-window.active { transform: scale(1) translateY(0); opacity: 1; border-radius: 0px; pointer-events: auto; }
    .app-header { height: 54px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; background: #1c1c24; border-bottom: 1px solid #2c2c38; font-weight: 700; }
    .app-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; }

    /* 🛡️ 雙側手勢觸發護罩 (解決 Map/Iframe 蓋過手勢問題) */
    .edge-gesture-trigger { position: absolute; top: 0; bottom: 0; width: 30px; z-index: 998; pointer-events: auto; }
    .edge-trigger-left { left: 0; }
    .edge-trigger-right { right: 0; }

    .home-bar-area {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: calc(30px + var(--safe-bottom));
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: calc(8px + var(--safe-bottom));
      pointer-events: auto;
    }
    .home-bar { width: 140px; height: 5px; background: #fff; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }

    /* 兩段式手勢膠囊 UI */
    .gesture-pill {
      position: absolute;
      top: 50%;
      transform: translateY(-50%) scale(0.8);
      width: 44px;
      height: 72px;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 36px;
      z-index: 1100;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s, background 0.2s;
      pointer-events: none;
    }
    .gesture-left { left: 12px; }
    .gesture-right { right: 12px; }
    .gesture-pill.stage2 { background: #0a84ff; border-color: #64d2ff; transform: translateY(-50%) scale(1.1); }

    /* 下滑控制中心 */
    .control-center {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 1500;
      display: flex;
      flex-direction: column;
      padding: calc(60px + var(--safe-top)) 20px 40px;
      transform: translateY(-100%);
      transition: transform 0.4s var(--ease-apple);
    }
    .control-center.active { transform: translateY(0); }
    .control-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .control-card { background: rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .control-btn { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.1); padding: 12px; border-radius: 14px; cursor: pointer; }
    .control-btn.active { background: #0a84ff; }

    /* 通用 UI 組件 */
    .settings-group { background: #1c1c24; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .settings-title { font-size: 12px; text-transform: uppercase; color: #8e8e93; margin-bottom: 10px; font-weight: 600; }
    .setting-input { background: #2c2c38; border: none; padding: 10px 14px; border-radius: 10px; color: #fff; width: 100%; font-size: 14px; outline: none; }
    .setting-btn { background: #0a84ff; color: #fff; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    iframe.app-iframe { width: 100%; height: 100%; border: none; flex: 1; }
  </style>
</head>
<body>

  <div class="frx-os" id="frx-os">

    <!-- 頂部狀態列 -->
    <div class="status-bar" id="status-bar">
      <span id="clock">21:20</span>
      <div class="dynamic-island" id="dynamic-island" onclick="toggleIsland()">
        <div class="island-content" id="island-content">
          <span id="island-text" style="font-weight:700;">FRX Pro</span>
        </div>
        <div class="island-dot"></div>
      </div>
      <div><span>5G</span> <span style="margin-left:4px;">100%</span></div>
    </div>

    <!-- 🔒 鎖定畫面 (Lockscreen) -->
    <div class="lock-screen" id="lock-screen" onclick="showPasscodeUI()">
      <div class="lock-clock-box">
        <div class="lock-time" id="lock-time">21:20</div>
        <div class="lock-date" id="lock-date">9月16日 星期三</div>
      </div>

      <!-- 密碼輸入盤面 -->
      <div class="passcode-container" id="passcode-container" onclick="event.stopPropagation()">
        <h3 style="font-size: 18px; font-weight: 500;">輸入密碼解鎖</h3>
        <div class="passcode-dots" id="passcode-dots">
          <div class="pass-dot"></div><div class="pass-dot"></div><div class="pass-dot"></div>
          <div class="pass-dot"></div><div class="pass-dot"></div><div class="pass-dot"></div>
        </div>
        <div class="passcode-pad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="pass-btn" onclick="pressPasscode('${n}')">${n}</button>`).join('')}
          <div style="width:70px;"></div>
          <button class="pass-btn" onclick="pressPasscode('0')">0</button>
          <button class="pass-btn" style="font-size:18px;" onclick="clearPasscode()">清除</button>
        </div>
      </div>

      <div class="lock-bottom-actions" onclick="event.stopPropagation()">
        <div class="lock-quick-btn">🔦</div>
        <div style="font-size:13px; opacity:0.7;">向上滑動或點擊解鎖</div>
        <div class="lock-quick-btn" onclick="openAppFromLock('相機')">📷</div>
      </div>
    </div>

    <!-- 📱 可左右滑動的分頁桌面 -->
    <div class="paged-desktop" id="paged-desktop">
      <!-- 頁面 1 -->
      <div class="desktop-page">
        <div class="widget-banner">
          <div>
            <h2 style="font-size: 18px;">FRX OS 1 旗艦系統</h2>
            <p style="font-size: 11px; color: #ccc; margin-top: 2px;">自動鎖屏 + 左右分頁 + 雙側手勢修復</p>
          </div>
          <div class="widget-img-container">
            <img src="https://i.ibb.co/0RHgQJcw/Background-Eraser.png" alt="FRX Logo">
          </div>
        </div>
        <div class="app-grid" id="app-grid-1"></div>
      </div>

      <!-- 頁面 2 -->
      <div class="desktop-page">
        <div class="app-grid" id="app-grid-2"></div>
      </div>
    </div>

    <!-- 桌面分頁點 -->
    <div class="page-dots">
      <div class="p-dot active" id="pdot-0"></div>
      <div class="p-dot" id="pdot-1"></div>
    </div>

    <!-- Dock 欄 -->
    <div class="dock-wrapper" id="dock-wrapper">
      <div class="dock-handle" onclick="toggleDock()"></div>
      <div class="dock-grid" id="dock-grid"></div>
    </div>

    <!-- 全螢幕 App 視窗 -->
    <div class="app-window" id="app-window">
      <div class="app-header">
        <span id="app-title">App</span>
        <button style="color:#0a84ff;background:none;border:none;font-weight:600;font-size:14px;cursor:pointer;" onclick="closeApp()">完成</button>
      </div>
      <div class="app-body" id="app-body"></div>

      <!-- 側邊手勢護罩 (阻止 Iframe/地圖吃掉手勢) -->
      <div class="edge-gesture-trigger edge-trigger-left"></div>
      <div class="edge-gesture-trigger edge-trigger-right"></div>
    </div>

    <!-- 下滑控制中心 -->
    <div class="control-center" id="control-center">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h2>控制中心</h2>
        <button onclick="toggleControlCenter()" style="color:#0a84ff;background:none;border:none;font-size:16px;">關閉</button>
      </div>
      <div class="control-grid">
        <div class="control-card">
          <div class="control-btn active" id="btn-wifi" onclick="toggleControl('wifi')">
            <span>📶</span> <span>Wi-Fi</span>
          </div>
          <div class="control-btn active" id="btn-bt" onclick="toggleControl('bt')">
            <span>📡</span> <span>藍牙</span>
          </div>
        </div>
        <div class="control-card">
          <label style="font-size:12px;color:#aaa;">螢幕亮度</label>
          <input type="range" min="30" max="100" value="100" oninput="adjustBrightness(this.value)" style="width:100%;">
        </div>
      </div>
    </div>

    <!-- 底部 Home Bar -->
    <div class="home-bar-area" id="home-bar-area">
      <div class="home-bar"></div>
    </div>

    <!-- 兩段式手勢指示 UI -->
    <div class="gesture-pill gesture-left" id="gesture-left">‹</div>
    <div class="gesture-pill gesture-right" id="gesture-right">›</div>

  </div>

  <script>
    // 完整 App 清單數據
    const appsData = [
      { id: 'camera', name: '相機', icon: '📷', bg: 'linear-gradient(135deg, #FF9500, #FF5E00)' },
      { id: 'photos', name: '相簿', icon: '🖼️', bg: 'linear-gradient(135deg, #34C759, #008E00)' },
      { id: 'calc', name: '計算機', icon: '🧮', bg: 'linear-gradient(135deg, #FF9F0A, #FF7B00)' },
      { id: 'settings', name: '設定', icon: '⚙️', bg: 'linear-gradient(135deg, #5856D6, #3634A3)' },
      { id: 'music', name: '音樂', icon: '🎵', bg: 'linear-gradient(135deg, #FF2D55, #D10040)' },
      { id: 'weather', name: '天氣', icon: '☁️', bg: 'linear-gradient(135deg, #007AFF, #0040DD)' },
      { id: 'notes', name: '記事本', icon: '📝', bg: 'linear-gradient(135deg, #FFCC00, #FFA000)' },
      { id: 'maps', name: '地圖', icon: '🗺️', bg: 'linear-gradient(135deg, #30B0C7, #007AFF)' },
      { id: 'phone', name: '電話', icon: '📞', bg: 'linear-gradient(135deg, #34C759, #119922)' },
      { id: 'messages', name: '訊息', icon: '💬', bg: 'linear-gradient(135deg, #007AFF, #0055FF)' },
      { id: 'browser', name: '瀏覽器', icon: '🌐', bg: 'linear-gradient(135deg, #55E0C4, #00A88F)' },
      { id: 'clockApp', name: '鬧鐘', icon: '⏰', bg: 'linear-gradient(135deg, #5E5CE6, #3634A3)' }
    ];

    const os = document.getElementById('frx-os');
    const lockScreen = document.getElementById('lock-screen');
    const appWindow = document.getElementById('app-window');
    const appTitle = document.getElementById('app-title');
    const appBody = document.getElementById('app-body');
    const pagedDesktop = document.getElementById('paged-desktop');
    const dockGrid = document.getElementById('dock-grid');
    const dockWrapper = document.getElementById('dock-wrapper');
    const controlCenter = document.getElementById('control-center');
    const dynamicIsland = document.getElementById('dynamic-island');
    const islandContent = document.getElementById('island-content');

    let isEditing = false;
    let isMusicPlaying = false;
    let currentPasscodeInput = '';
    let currentPage = 0;
    let audioElem = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');

    // 本地持久化數據 (包含預設 6 位密碼 000000)
    let settings = JSON.parse(localStorage.getItem('frx_settings')) || {
      bgUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000',
      passcode: '000000',
      islandText: 'FRX Pro'
    };

    function applySettings() {
      os.style.backgroundImage = `url('${settings.bgUrl}')`;
      document.getElementById('island-text').textContent = settings.islandText;
    }
    applySettings();

    // 🔒 離開/切換網頁時自動鎖屏 (Visibility/Blur API)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) lockOS();
    });
    window.addEventListener('blur', () => lockOS());

    function lockOS() {
      lockScreen.classList.remove('hidden', 'show-passcode');
      currentPasscodeInput = '';
      updatePasscodeDots();
    }

    function showPasscodeUI() {
      lockScreen.classList.add('show-passcode');
    }

    function pressPasscode(val) {
      if (currentPasscodeInput.length < 6) {
        currentPasscodeInput += val;
        updatePasscodeDots();
        if (currentPasscodeInput.length === 6) {
          setTimeout(verifyPasscode, 150);
        }
      }
    }

    function clearPasscode() {
      currentPasscodeInput = '';
      updatePasscodeDots();
    }

    function updatePasscodeDots() {
      const dots = document.querySelectorAll('.pass-dot');
      dots.forEach((dot, idx) => {
        if (idx < currentPasscodeInput.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
      });
    }

    function verifyPasscode() {
      if (currentPasscodeInput === settings.passcode) {
        lockScreen.classList.add('hidden');
        currentPasscodeInput = '';
        updatePasscodeDots();
      } else {
        alert('❌ 密碼錯誤，請重新輸入！');
        clearPasscode();
      }
    }

    function openAppFromLock(appName) {
      lockScreen.classList.add('hidden');
      openApp(appName);
    }

    // 📱 可左右滑動的分頁桌面實現
    function renderApps() {
      const page1 = document.getElementById('app-grid-1');
      const page2 = document.getElementById('app-grid-2');
      page1.innerHTML = '';
      page2.innerHTML = '';
      dockGrid.innerHTML = '';

      appsData.slice(0, 8).forEach(app => page1.appendChild(createAppElem(app)));
      appsData.slice(8, 12).forEach(app => page2.appendChild(createAppElem(app)));
      appsData.slice(4, 12).forEach(app => dockGrid.appendChild(createAppElem(app, true)));
    }

    function createAppElem(app, isDock = false) {
      const item = document.createElement('div');
      item.className = 'app-item';
      item.onclick = () => { if (!isEditing) openApp(app.name); };

      let pressTimer;
      item.ontouchstart = () => { pressTimer = setTimeout(() => document.body.classList.add('editing'), 600); };
      item.ontouchend = () => clearTimeout(pressTimer);

      item.innerHTML = `
        <div class="remove-btn" onclick="event.stopPropagation(); this.parentElement.remove()">—</div>
        <div class="app-icon" style="background:${app.bg};">${app.icon}</div>
        ${!isDock ? `<span class="app-name">${app.name}</span>` : ''}
      `;
      return item;
    }

    // 桌面滑動分頁事件
    let deskStartX = 0;
    pagedDesktop.addEventListener('touchstart', (e) => { deskStartX = e.touches[0].clientX; }, { passive: true });
    pagedDesktop.addEventListener('touchend', (e) => {
      const diffX = deskStartX - e.changedTouches[0].clientX;
      if (diffX > 50 && currentPage === 0) switchDesktopPage(1);
      else if (diffX < -50 && currentPage === 1) switchDesktopPage(0);
    }, { passive: true });

    function switchDesktopPage(pageIdx) {
      currentPage = pageIdx;
      pagedDesktop.style.transform = `translateX(-${pageIdx * 50}%)`;
      document.getElementById('pdot-0').classList.toggle('active', pageIdx === 0);
      document.getElementById('pdot-1').classList.toggle('active', pageIdx === 1);
    }

    document.getElementById('frx-os').onclick = (e) => {
      if (e.target.classList.contains('desktop-page')) document.body.classList.remove('editing');
    };

    // 時間更新
    function updateTime() {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      document.getElementById('clock').textContent = timeStr;
      document.getElementById('lock-time').textContent = timeStr;
      
      const weeks = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
      document.getElementById('lock-date').textContent = `${now.getMonth()+1}月${now.getDate()}日 ${weeks[now.getDay()]}`;
    }
    setInterval(updateTime, 1000);
    updateTime();

    // 控制中心 & 動態島
    function toggleIsland() { dynamicIsland.classList.toggle('expanded'); }
    function setIslandContent(html) { islandContent.innerHTML = html; }
    function toggleControlCenter() { controlCenter.classList.toggle('active'); }
    function adjustBrightness(val) { os.style.filter = `brightness(${val}%)`; }
    function toggleControl(type) { document.getElementById(`btn-${type}`).classList.toggle('active'); }
    function toggleDock() { dockWrapper.classList.toggle('expanded'); }

    // 開啟 App
    function openApp(name) {
      appTitle.textContent = name;
      appBody.innerHTML = '';

      if (name === '相機') {
        appBody.innerHTML = `
          <div style="flex:1;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px;">
            <video id="camera-video" autoplay playsinline style="width:100%;height:70%;object-fit:cover;border-radius:24px;background:#222;"></video>
            <button onclick="takePhoto()" style="width:74px;height:74px;border-radius:50%;border:4px solid #fff;background:none;margin-bottom:20px;cursor:pointer;"></button>
          </div>
        `;
        startCamera();
        setIslandContent('🟢 <span>相機使用中</span>');
      } else if (name === '相簿') {
        renderPhotosApp();
      } else if (name === '設定') {
        renderSettingsApp();
      } else if (name === '計算機') {
        renderCalcApp();
      } else if (name === '音樂') {
        renderMusicApp();
      } else if (name === '地圖') {
        appBody.innerHTML = `<iframe class="app-iframe" src="https://www.openstreetmap.org/export/embed.html?bbox=121.50,25.00,121.58,25.08&layer=mapnik"></iframe>`;
      } else if (name === '瀏覽器') {
        appBody.innerHTML = `
          <div style="padding:10px;background:#1c1c24;display:flex;gap:8px;">
            <input type="text" id="browser-url" value="https://duckduckgo.com" class="setting-input">
            <button onclick="navigateUrl()" class="setting-btn">前往</button>
          </div>
          <iframe id="browser-iframe" class="app-iframe" src="https://duckduckgo.com"></iframe>
        `;
      } else {
        appBody.innerHTML = `<div style="padding:30px;text-align:center;color:#aaa;">${name} App 正常運作中</div>`;
      }

      appWindow.classList.add('active');
    }

    function closeApp() {
      appWindow.classList.remove('active');
      stopCamera();
      if (!isMusicPlaying) setIslandContent(`<span id="island-text" style="font-weight:700;">${settings.islandText}</span>`);
    }

    /* --- Apps 核心實現 --- */
    let videoStream = null;
    async function startCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        const video = document.getElementById('camera-video');
        if (video) video.srcObject = videoStream;
      } catch (err) { alert('請允許相機存取權限以進行拍照'); }
    }
    function stopCamera() { if (videoStream) videoStream.getTracks().forEach(t => t.stop()); }
    function takePhoto() {
      alert('📸 照片已拍攝並儲存至相簿！');
    }

    function renderPhotosApp() {
      appBody.innerHTML = `<div style="padding:20px;text-align:center;color:#aaa;">相簿內容加載完畢</div>`;
    }

    function renderSettingsApp() {
      appBody.innerHTML = `
        <div style="padding:16px;display:flex;flex-direction:column;gap:12px;">
          <div class="settings-group">
            <div class="settings-title">🔒 更改 6 位數解鎖密碼</div>
            <input type="password" id="cfg-passcode" class="setting-input" maxlength="6" value="${settings.passcode}">
            <button class="setting-btn" style="margin-top:8px;width:100%;" onclick="updatePasscode()">更新解鎖密碼</button>
          </div>

          <div class="settings-group">
            <div class="settings-title">🎨 客製化桌布</div>
            <input type="text" id="cfg-bg-url" class="setting-input" value="${settings.bgUrl}">
            <div style="display:flex;gap:8px;margin-top:8px;">
              <button class="setting-btn" style="flex:1;" onclick="updateBgUrl()">套用網址</button>
              <label class="setting-btn" style="background:#34c759;cursor:pointer;">
                上傳照片
                <input type="file" accept="image/*" style="display:none;" onchange="uploadLocalBg(event)">
              </label>
            </div>
          </div>
        </div>
      `;
    }

    function updatePasscode() {
      const val = document.getElementById('cfg-passcode').value;
      if (val.length === 6) {
        settings.passcode = val;
        localStorage.setItem('frx_settings', JSON.stringify(settings));
        alert('🔑 解鎖密碼已更換！');
      } else alert('密碼長度必須為 6 位數字！');
    }

    function updateBgUrl() {
      const url = document.getElementById('cfg-bg-url').value;
      if (url) {
        settings.bgUrl = url;
        localStorage.setItem('frx_settings', JSON.stringify(settings));
        applySettings();
        alert('✨ 桌布已更換！');
      }
    }

    function uploadLocalBg(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          settings.bgUrl = evt.target.result;
          localStorage.setItem('frx_settings', JSON.stringify(settings));
          applySettings();
          alert('🖼️ 本地照片已設定為桌布！');
        };
        reader.readAsDataURL(file);
      }
    }

    function renderCalcApp() { appBody.innerHTML = `<div style="padding:40px;text-align:center;font-size:32px;">計算機運作中</div>`; }
    function renderMusicApp() { appBody.innerHTML = `<div style="padding:40px;text-align:center;font-size:32px;">音樂播放器運作中</div>`; }
    function navigateUrl() {
      let url = document.getElementById('browser-url').value;
      if (!url.startsWith('http')) url = 'https://' + url;
      document.getElementById('browser-iframe').src = url;
    }

    // 🌟 全域雙側兩段式手勢 & Home Bar 手勢 (完美保留且防護 Iframe/地圖)
    let touchStartX = 0, touchStartY = 0;
    const gLeft = document.getElementById('gesture-left');
    const gRight = document.getElementById('gesture-right');

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const currentX = e.touches[0].clientX;
      const currentY = e.touches[0].clientY;
      const diffX = currentX - touchStartX;
      const diffY = currentY - touchStartY;

      if (touchStartX < 40 && diffX > 0) {
        gLeft.style.opacity = '1';
        gLeft.classList.toggle('stage2', diffX > 130);
        gLeft.innerHTML = diffX > 130 ? '⌂' : '‹';
      } else if (touchStartX > window.innerWidth - 40 && diffX < 0) {
        gRight.style.opacity = '1';
        gRight.classList.toggle('stage2', Math.abs(diffX) > 130);
        gRight.innerHTML = Math.abs(diffX) > 130 ? '⌂' : '›';
      }

      if (touchStartY < 50 && touchStartX > window.innerWidth - 100 && diffY > 60) toggleControlCenter();
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = touchStartY - e.changedTouches[0].clientY;

      gLeft.style.opacity = '0';
      gRight.style.opacity = '0';

      if ((touchStartX < 40 && diffX > 50) || (touchStartX > window.innerWidth - 40 && diffX < -50)) {
        closeApp();
      }

      if (touchStartY > window.innerHeight - 60 && diffY > 50) {
        closeApp();
      }
    }, { passive: true });

    renderApps();
  </script>
</body>
</html>
