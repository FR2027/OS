<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nebula Core OS - Next-Gen Concept</title>
    <style>
        :root {
            --bg-deep: #07080d;
            --accent-glow: #7928CA;
            --accent-cyan: #00DFD8;
            --accent-gold: #FF0080;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #FFFFFF;
            --text-sub: rgba(255, 255, 255, 0.55);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #030406;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. 開機動畫 */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #05060a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .nebula-core {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--accent-glow), var(--accent-cyan));
            box-shadow: 0 0 30px var(--accent-glow);
            animation: pulseCore 1.5s infinite alternate ease-in-out;
        }

        @keyframes pulseCore {
            0% { transform: scale(0.85); box-shadow: 0 0 15px var(--accent-glow); }
            100% { transform: scale(1.15); box-shadow: 0 0 45px var(--accent-cyan); }
        }

        .loader-title {
            margin-top: 25px;
            font-size: 1.1rem;
            letter-spacing: 6px;
            font-weight: 300;
            background: linear-gradient(90deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 2. 手機機身容器 */
        .phone-container {
            width: 380px;
            height: 780px;
            background: #0d0e15;
            border-radius: 54px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.9), 0 0 50px rgba(121, 40, 202, 0.15);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .phone-container.active {
            opacity: 1;
            transform: scale(1);
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 80% 20%, #1a102f 0%, #07080d 60%, #0a1118 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 頂部狀態列 */
        .status-bar {
            height: 44px;
            padding: 0 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 100;
            letter-spacing: 1px;
        }

        /* 背景流體光暈 */
        .ambient-glow {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(121, 40, 202, 0.25) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: -10%;
            pointer-events: none;
            animation: floatGlow 8s infinite alternate ease-in-out;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 80px) scale(1.2); }
        }

        /* 多頁滑動區域 */
        .viewport-wrapper {
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .pages-viewport {
            display: flex;
            width: 200%;
            height: 100%;
            will-change: transform;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pages-viewport.dragging { transition: none; }

        .page {
            width: 50%;
            height: 100%;
            padding: 10px 22px 100px 22px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .page::-webkit-scrollbar { display: none; }

        /* 創新卡片 & 流線布局 */
        .card-organic {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .card-hero {
            border-radius: 40px 18px 40px 40px;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(121, 40, 202, 0.12) 100%);
        }

        /* 創新錯位 App 陣列 */
        .organic-app-cluster {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        .app-row {
            display: flex;
            gap: 14px;
            justify-content: space-between;
        }

        .app-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex: 1;
        }

        .app-item:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.12);
        }

        .app-item.square-style {
            flex-direction: column;
            justify-content: center;
            padding: 18px 10px;
            aspect-ratio: 1 / 1;
            flex: unset;
            width: 48%;
        }

        .app-icon-wrapper {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .app-icon-wrapper svg {
            width: 20px;
            height: 20px;
            stroke: #ffffff;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .app-text-group {
            display: flex;
            flex-direction: column;
        }

        .app-title { font-size: 0.85rem; font-weight: 500; }
        .app-desc { font-size: 0.65rem; color: var(--text-sub); }

        /* 🚀 創新核心：星體懸浮光環 DOCK (Orbital Core Dock) */
        .orbital-dock-container {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 展開的星體 App 軌道 */
        .dock-orbit {
            position: absolute;
            width: 240px;
            height: 70px;
            background: rgba(18, 20, 32, 0.85);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.5);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .orbital-dock-container.expanded .dock-orbit {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1) translateY(-60px);
        }

        .orbit-app {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .orbit-app:active { transform: scale(0.85); }

        .orbit-app svg {
            width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 1.8;
        }

        /* 中央懸浮星體主按鈕 */
        .core-trigger {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-glow));
            box-shadow: 0 0 25px rgba(0, 223, 216, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 201;
            animation: orbFloat 3s infinite alternate ease-in-out;
            transition: transform 0.3s ease;
        }

        .orbital-dock-container.expanded .core-trigger {
            transform: rotate(45deg);
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-glow));
            box-shadow: 0 0 25px rgba(255, 0, 128, 0.6);
        }

        @keyframes orbFloat {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        /* 全域微光提示 Toast Modal */
        .toast-dialog {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(20, 22, 35, 0.9);
            backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 24px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .toast-dialog.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .toast-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 0, 128, 0.15);
            border: 1px solid var(--accent-gold);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        .toast-title { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .toast-desc { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 18px; }

        .toast-btn {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 24px;
            border-radius: 16px;
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* 指示點 */
        .pagination-dots {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }
        .dot.active { width: 14px; border-radius: 8px; background: var(--accent-cyan); }
    </style>
</head>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loader');
            const phone = document.getElementById('phone');
            const viewport = document.getElementById('viewport');
            const wrapper = document.getElementById('viewportWrapper');
            const orbitalDock = document.getElementById('orbitalDock');
            const coreBtn = document.getElementById('coreBtn');
            const toastModal = document.getElementById('toastModal');

            let currentPage = 0;
            let startX = 0, startY = 0;
            let currentTranslate = 0;
            let prevTranslate = 0;
            let isDragging = false;
            let isHorizontalSwipe = false;

            // 開機動畫淡出
            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                phone.classList.add('active');
            }, 1500);

            // 星體 Dock 展開/收合
            coreBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                orbitalDock.classList.toggle('expanded');
            });

            // 點擊其他地方收合 Dock
            document.addEventListener('click', () => {
                orbitalDock.classList.remove('expanded');
            });

            // 分頁切換邏輯
            function updatePagePosition() {
                currentTranslate = -currentPage * 50;
                prevTranslate = currentTranslate;
                viewport.style.transform = `translateX(${currentTranslate}%)`;
                
                document.querySelectorAll('.dot').forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentPage);
                });
            }

            function touchStart(e) {
                const touch = e.type.includes('touch') ? e.touches[0] : e;
                startX = touch.clientX;
                startY = touch.clientY;
                isDragging = true;
                isHorizontalSwipe = false;
                viewport.classList.add('dragging');
            }

            function touchMove(e) {
                if (!isDragging) return;
                const touch = e.type.includes('touch') ? e.touches[0] : e;
                const deltaX = touch.clientX - startX;
                const deltaY = touch.clientY - startY;

                if (!isHorizontalSwipe) {
                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 8) {
                        isHorizontalSwipe = true;
                    } else if (Math.abs(deltaY) > Math.abs(deltaX)) {
                        return;
                    }
                }

                if (isHorizontalSwipe) {
                    if (e.cancelable) e.preventDefault();
                    const containerWidth = wrapper.clientWidth;
                    const dragPercent = (deltaX / containerWidth) * 50;
                    viewport.style.transform = `translateX(${prevTranslate + dragPercent}%)`;
                }
            }

            function touchEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                viewport.classList.remove('dragging');

                if (isHorizontalSwipe) {
                    const endX = e.type.includes('touch') ? e.changedTouches[0].clientX : e.clientX;
                    const diffX = startX - endX;

                    if (diffX > 40 && currentPage < 1) {
                        currentPage++;
                    } else if (diffX < -40 && currentPage > 0) {
                        currentPage--;
                    }
                }
                updatePagePosition();
            }

            wrapper.addEventListener('touchstart', touchStart, { passive: true });
            wrapper.addEventListener('touchmove', touchMove, { passive: false });
            wrapper.addEventListener('touchend', touchEnd);

            wrapper.addEventListener('mousedown', touchStart);
            window.addEventListener('mousemove', touchMove);
            window.addEventListener('mouseup', touchEnd);

            // 點擊 App 顯示「暫時不支援預覽」
            document.querySelectorAll('.clickable-app').forEach(app => {
                app.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toastModal.classList.add('show');
                });
            });

            window.closeToast = () => {
                toastModal.classList.remove('show');
            };
        });
    </script>
</body>
</html>
