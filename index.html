<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FRX Neural OS - Next Gen Concept</title>
    <style>
        :root {
            --bg-deep: #0a0b10;
            --accent-warm: #f6b179;
            --accent-soft: #a0c4ff;
            --accent-purple: #c77dff;
            --glass-card: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.16);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, sans-serif;
        }

        body {
            background-color: #050608;
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 1. 經典啟動畫面 (回到原始質感風格) */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0d0e15;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .frx-logo {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 8px;
            background: linear-gradient(90deg, #ffffff, var(--accent-warm));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .loader-bar-container {
            width: 130px; height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 25px;
            overflow: hidden;
        }

        .loader-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, var(--accent-warm), var(--accent-soft));
            animation: loadProgress 1.8s forwards cubic-bezier(0.65, 0, 0.35, 1);
        }

        @keyframes loadProgress { 0% { width: 0%; } 100% { width: 100%; } }

        /* 2. 手機機身容器 */
        .phone-container {
            width: 380px;
            height: 780px;
            background: #111218;
            border-radius: 54px;
            border: 4px solid #2b2d3d;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.85), 0 0 45px rgba(246, 177, 121, 0.1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .phone-container.active {
            opacity: 1;
            transform: scale(1);
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(155deg, #12131C 0%, #1A1C2E 45%, #2A2538 80%, #182030 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 動態流體光影背景 */
        .ambient-blob {
            position: absolute;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(199, 125, 255, 0.25) 0%, rgba(0,0,0,0) 70%);
            top: -50px;
            right: -50px;
            pointer-events: none;
            animation: blobMove 10s infinite alternate ease-in-out;
        }

        @keyframes blobMove {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-60px, 80px) scale(1.2); }
        }

        /* 狀態列與動態島 */
        .status-bar {
            height: 44px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 100;
            pointer-events: none;
        }

        .dynamic-island {
            width: 95px;
            height: 22px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }

        /* 滑動區域 */
        .viewport-wrapper {
            flex: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .pages-viewport {
            display: flex;
            width: 200%;
            height: 100%;
            will-change: transform;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .pages-viewport.dragging { transition: none; }

        .page {
            width: 50%;
            height: 100%;
            overflow-y: auto;
            padding: 10px 20px 90px 20px;
            scrollbar-width: none;
        }
        .page::-webkit-scrollbar { display: none; }

        /* 🚀 創新排版 1：幾何異形主 Widget */
        .hero-widget {
            background: var(--glass-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: 36px 16px 36px 36px;
            padding: 22px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 100%);
        }

        .time-display {
            font-size: 3.2rem;
            font-weight: 200;
            line-height: 1;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #ffffff, rgba(255,255,255,0.6));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 🚀 創新排版 2：非對稱多功能區塊 */
        .asymmetric-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 14px;
            margin-bottom: 20px;
        }

        .grid-card {
            background: var(--glass-card);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 26px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .grid-card:active { transform: scale(0.93); }

        /* 動態音波動畫 */
        .wave-container {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 18px;
            margin-top: 10px;
        }
        .wave-bar {
            width: 3px;
            background: var(--accent-warm);
            border-radius: 3px;
            animation: waveBounce 1.2s infinite ease-in-out alternate;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; height: 70%; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; height: 100%; }
        .wave-bar:nth-child(4) { animation-delay: 0.1s; height: 40%; }

        @keyframes waveBounce {
            0% { height: 20%; }
            100% { height: 100%; }
        }

        /* 🚀 創新排版 3：流線型 App 橫欄 (Stream Rows) */
        .app-stream {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .app-stream-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .app-stream-item:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.12);
        }

        .app-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-icon-box {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-icon-box svg {
            width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* 🚀 創新 Dock：流體動態懸浮膠囊 (Fluid Floating Dock) */
        .dock-wrapper {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            width: 88%;
        }

        .fluid-dock {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 35px;
            padding: 10px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .dock-icon {
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .dock-icon:active { transform: scale(0.8); }

        .dock-icon svg {
            width: 22px; height: 22px; stroke: #ffffff; fill: none; stroke-width: 1.8;
        }

        /* 分頁指示器 */
        .pagination-dots {
            position: absolute;
            bottom: 82px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transition: all 0.35s ease;
        }

        .dot.active { width: 18px; border-radius: 10px; background: var(--accent-warm); }

        /* 全域提示 Modal (暫時不支援預覽) */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            z-index: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 260px;
            background: rgba(30, 32, 48, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-card { transform: scale(1); }

        .modal-title { font-size: 1.05rem; font-weight: 500; margin-bottom: 6px; }
        .modal-desc { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 20px; }

        .modal-btn {
            background: var(--accent-warm);
            color: #000;
            font-weight: 600;
            border: none;
            padding: 10px 0;
            width: 100%;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.85rem;
        }
    </style>
</head>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loader');
            const phone = document.getElementById('phone');
            const viewport = document.getElementById('viewport');
            const wrapper = document.getElementById('viewportWrapper');
            const modal = document.getElementById('modal');

            let currentPage = 0;
            let startX = 0, startY = 0;
            let currentTranslate = 0;
            let prevTranslate = 0;
            let isDragging = false;
            let isHorizontalSwipe = false;

            // 開機動畫淡出並滑入主畫面
            setTimeout(() => {
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                phone.classList.add('active');
            }, 1800);

            // 分頁切換邏輯
            function updatePagePosition() {
                currentTranslate = -currentPage * 50;
                prevTranslate = currentTranslate;
                viewport.style.transform = `translateX(${currentTranslate}%)`;
                
                document.querySelectorAll('.dot').forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentPage);
                });
            }

            function touchStart(e) {
                const touch = e.type.includes('touch') ? e.touches[0] : e;
                startX = touch.clientX;
                startY = touch.clientY;
                isDragging = true;
                isHorizontalSwipe = false;
                viewport.classList.add('dragging');
            }

            function touchMove(e) {
                if (!isDragging) return;
                const touch = e.type.includes('touch') ? e.touches[0] : e;
                const deltaX = touch.clientX - startX;
                const deltaY = touch.clientY - startY;

                if (!isHorizontalSwipe) {
                    if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 8) {
                        isHorizontalSwipe = true;
                    } else if (Math.abs(deltaY) > Math.abs(deltaX)) {
                        return;
                    }
                }

                if (isHorizontalSwipe) {
                    if (e.cancelable) e.preventDefault();
                    const containerWidth = wrapper.clientWidth;
                    const dragPercent = (deltaX / containerWidth) * 50;
                    viewport.style.transform = `translateX(${prevTranslate + dragPercent}%)`;
                }
            }

            function touchEnd(e) {
                if (!isDragging) return;
                isDragging = false;
                viewport.classList.remove('dragging');

                if (isHorizontalSwipe) {
                    const endX = e.type.includes('touch') ? e.changedTouches[0].clientX : e.clientX;
                    const diffX = startX - endX;

                    if (diffX > 40 && currentPage < 1) {
                        currentPage++;
                    } else if (diffX < -40 && currentPage > 0) {
                        currentPage--;
                    }
                }
                updatePagePosition();
            }

            wrapper.addEventListener('touchstart', touchStart, { passive: true });
            wrapper.addEventListener('touchmove', touchMove, { passive: false });
            wrapper.addEventListener('touchend', touchEnd);

            wrapper.addEventListener('mousedown', touchStart);
            window.addEventListener('mousemove', touchMove);
            window.addEventListener('mouseup', touchEnd);

            // App 點擊邏輯
            document.querySelectorAll('.app-trigger').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    modal.classList.add('show');
                });
            });

            window.closeModal = () => {
                modal.classList.remove('show');
            };
        });
    </script>
</body>
</html>
