<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="https://i.ibb.co/0RHgQJcw/Background-Eraser.png">
  <title>FRX OS 1</title>

  <style>
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      --glass-bg: rgba(255, 255, 255, 0.2);
      --glass-border: rgba(255, 255, 255, 0.3);
      --glass-blur: blur(25px) saturate(180%);
      --spring: cubic-bezier(0.2, 0.9, 0.1, 1);
      --icon-radius: 16px;
      --icon-size: 58px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    /* 滿版 OS 系統容器 */
    .frx-os {
      width: 100vw;
      height: 100dvh;
      position: relative;
      background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* 密碼解鎖層 */
    .lockscreen {
      position: absolute;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 50px 20px 40px;
      transition: transform 0.5s var(--spring), opacity 0.3s ease;
    }

    .lockscreen.unlocked {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .lock-time { font-size: 76px; font-weight: 200; letter-spacing: -2px; text-align: center; }
    .lock-date { font-size: 18px; font-weight: 500; color: rgba(255,255,255,0.85); text-align: center; }

    .passcode-box { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }
    .dots-container { display: flex; gap: 14px; margin-bottom: 8px; }
    .pass-dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #fff; transition: background 0.2s; }
    .pass-dot.filled { background: #fff; }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 20px; }
    .key-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
    }
    .key-btn:active { background: rgba(255,255,255,0.5); }
    .key-sub { font-size: 8px; letter-spacing: 1px; opacity: 0.7; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    .shake { animation: shake 0.35s ease; }

    /* 頂部狀態列 & 動態島 */
    .status-bar {
      height: 38px;
      width: 100%;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      z-index: 100;
    }

    .dynamic-island {
      min-width: 110px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 101;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }
    .island-dot { width: 7px; height: 7px; background: #34C759; border-radius: 50%; box-shadow: 0 0 6px #34C759; }

    /* 主畫面區域 */
    .main-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 20px 100px;
      gap: 16px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      overflow-y: auto;
    }

    .widget-banner {
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 12px; }
    .app-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .app-icon {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: var(--icon-radius);
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      transition: all 0.2s ease;
    }
    .app-item:active .app-icon { transform: scale(0.9); }
    .app-name { font-size: 11px; font-weight: 500; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

    /* Dock 欄 */
    .dock-bar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 400px;
      height: 76px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      z-index: 200;
    }

    /* App 視窗 */
    .app-window {
      position: absolute;
      inset: 0;
      background: #121217;
      z-index: 500;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      opacity: 0;
      transition: transform 0.4s var(--spring), opacity 0.25s ease;
      pointer-events: none;
    }
    .app-window.active { transform: translateY(0); opacity: 1; pointer-events: auto; }

    .app-header {
      height: 50px;
      padding: 0 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1c24;
      border-bottom: 1px solid #2c2c38;
      font-weight: 700;
    }
    .app-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; }
    .btn-done { font-size: 14px; color: #0a84ff; background: none; border: none; cursor: pointer; font-weight: 600; }

    /* 設定元件樣式 */
    .settings-group { background: #1c1c24; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .settings-title { font-size: 12px; text-transform: uppercase; color: #8e8e93; margin-bottom: 8px; font-weight: 600; }
    .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2c2c38; }
    .settings-row:last-child { border-bottom: none; }
    .setting-input { background: #2c2c38; border: none; padding: 8px 12px; border-radius: 8px; color: #fff; width: 100%; font-size: 14px; }
    .setting-btn { background: #0a84ff; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; }

    iframe.app-iframe { width: 100%; height: 100%; border: none; flex: 1; }
  </style>
</head>
<body>

  <div class="frx-os" id="frx-os">

    <!-- 解鎖畫面 -->
    <div class="lockscreen" id="lockscreen">
      <div>
        <div class="lock-time" id="lock-time">21:20</div>
        <div class="lock-date">FRX OS 1 個人化旗艦</div>
      </div>

      <div class="passcode-box" id="passcode-box">
        <p style="font-size: 13px; letter-spacing: 1px;">請輸入密碼解鎖</p>
        <div class="dots-container">
          <div class="pass-dot" id="dot-1"></div>
          <div class="pass-dot" id="dot-2"></div>
          <div class="pass-dot" id="dot-3"></div>
          <div class="pass-dot" id="dot-4"></div>
        </div>

        <div class="keypad">
          <div class="key-btn" onclick="pressKey('1')">1<span class="key-sub">&nbsp;</span></div>
          <div class="key-btn" onclick="pressKey('2')">2<span class="key-sub">ABC</span></div>
          <div class="key-btn" onclick="pressKey('3')">3<span class="key-sub">DEF</span></div>
          <div class="key-btn" onclick="pressKey('4')">4<span class="key-sub">GHI</span></div>
          <div class="key-btn" onclick="pressKey('5')">5<span class="key-sub">JKL</span></div>
          <div class="key-btn" onclick="pressKey('6')">6<span class="key-sub">MNO</span></div>
          <div class="key-btn" onclick="pressKey('7')">7<span class="key-sub">PQRS</span></div>
          <div class="key-btn" onclick="pressKey('8')">8<span class="key-sub">TUV</span></div>
          <div class="key-btn" onclick="pressKey('9')">9<span class="key-sub">WXYZ</span></div>
          <div style="width:68px;"></div>
          <div class="key-btn" onclick="pressKey('0')">0</div>
          <div class="key-btn" style="background:none;border:none;font-size:13px;" onclick="clearKey()">清除</div>
        </div>
      </div>
    </div>

    <!-- 動態島 & 狀態列 -->
    <div class="dynamic-island" id="dynamic-island">
      <span id="island-text" style="font-size: 10px; color: #8e8e93; font-weight:700;">FRX Pro</span>
      <div class="island-dot"></div>
    </div>
    <div class="status-bar">
      <span id="clock">21:20</span>
      <div><span>5G</span> <span>100%</span></div>
    </div>

    <!-- 主畫面 -->
    <div class="main-screen">
      <div class="widget-banner">
        <div>
          <h2 style="font-size: 18px;">FRX OS 1 智慧系統</h2>
          <p style="font-size: 11px; color: #ccc; margin-top: 2px;">自由客製化模式已啟用</p>
        </div>
        <img src="https://i.ibb.co/0RHgQJcw/Background-Eraser.png" style="width: 32px; height: 32px; object-fit: contain;">
      </div>

      <div class="app-grid">
        <div class="app-item" onclick="openApp('相機')"><div class="app-icon" style="background: linear-gradient(135deg, #FF9500, #FF5E00);">📷</div><span class="app-name">相機</span></div>
        <div class="app-item" onclick="openApp('相簿')"><div class="app-icon" style="background: linear-gradient(135deg, #34C759, #008E00);">🖼️</div><span class="app-name">相簿</span></div>
        <div class="app-item" onclick="openApp('計算機')"><div class="app-icon" style="background: linear-gradient(135deg, #FF9F0A, #FF7B00);">🧮</div><span class="app-name">計算機</span></div>
        <div class="app-item" onclick="openApp('設定')"><div class="app-icon" style="background: linear-gradient(135deg, #5856D6, #3634A3);">⚙️</div><span class="app-name">設定</span></div>
        <div class="app-item" onclick="openApp('音樂')"><div class="app-icon" style="background: linear-gradient(135deg, #FF2D55, #D10040);">🎵</div><span class="app-name">音樂</span></div>
        <div class="app-item" onclick="openApp('天氣')"><div class="app-icon" style="background: linear-gradient(135deg, #007AFF, #0040DD);">☁️</div><span class="app-name">天氣</span></div>
        <div class="app-item" onclick="openApp('記事本')"><div class="app-icon" style="background: linear-gradient(135deg, #FFCC00, #FFA000);">📝</div><span class="app-name">記事本</span></div>
        <div class="app-item" onclick="openApp('地圖')"><div class="app-icon" style="background: linear-gradient(135deg, #30B0C7, #007AFF);">🗺️</div><span class="app-name">地圖</span></div>
      </div>
    </div>

    <!-- Dock 欄 -->
    <div class="dock-bar">
      <div class="app-item" onclick="openApp('電話')"><div class="app-icon" style="background: linear-gradient(135deg, #34C759, #119922);">📞</div></div>
      <div class="app-item" onclick="openApp('訊息')"><div class="app-icon" style="background: linear-gradient(135deg, #007AFF, #0055FF);">💬</div></div>
      <div class="app-item" onclick="openApp('瀏覽器')"><div class="app-icon" style="background: linear-gradient(135deg, #55E0C4, #00A88F);">🌐</div></div>
      <div class="app-item" onclick="openApp('音樂')"><div class="app-icon" style="background: linear-gradient(135deg, #FA114F, #AF002D);">🎧</div></div>
    </div>

    <!-- App 視窗 -->
    <div class="app-window" id="app-window">
      <div class="app-header">
        <span id="app-title">App</span>
        <button class="btn-done" onclick="closeApp()">完成</button>
      </div>
      <div class="app-body" id="app-body"></div>
    </div>

  </div>

  <script>
    const os = document.getElementById('frx-os');
    const lockscreen = document.getElementById('lockscreen');
    const passcodeBox = document.getElementById('passcode-box');
    const appWindow = document.getElementById('app-window');
    const appTitle = document.getElementById('app-title');
    const appBody = document.getElementById('app-body');
    const clock = document.getElementById('clock');
    const lockTime = document.getElementById('lock-time');
    const dynamicIsland = document.getElementById('dynamic-island');
    const islandText = document.getElementById('island-text');

    // 讀取設定數據
    let settings = JSON.parse(localStorage.getItem('frx_settings')) || {
      passcode: '0000',
      bgUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000',
      iconRadius: 16,
      iconSize: 58,
      islandText: 'FRX Pro',
      showIsland: true,
      enableLockscreen: true
    };

    let inputPass = '';

    function applySettings() {
      os.style.backgroundImage = `url('${settings.bgUrl}')`;
      document.documentElement.style.setProperty('--icon-radius', `${settings.iconRadius}px`);
      document.documentElement.style.setProperty('--icon-size', `${settings.iconSize}px`);
      islandText.textContent = settings.islandText;
      dynamicIsland.style.display = settings.showIsland ? 'flex' : 'none';
      if (!settings.enableLockscreen) lockscreen.classList.add('unlocked');
      localStorage.setItem('frx_settings', JSON.stringify(settings));
    }
    applySettings();

    function updateTime() {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      clock.textContent = `${hrs}:${mins}`;
      lockTime.textContent = `${hrs}:${mins}`;
    }
    setInterval(updateTime, 1000);
    updateTime();

    function pressKey(num) {
      if (inputPass.length < 4) {
        inputPass += num;
        updatePassDots();
      }

      if (inputPass.length === 4) {
        setTimeout(() => {
          if (inputPass === settings.passcode) {
            lockscreen.classList.add('unlocked');
            inputPass = '';
            updatePassDots();
          } else {
            passcodeBox.classList.add('shake');
            setTimeout(() => {
              passcodeBox.classList.remove('shake');
              inputPass = '';
              updatePassDots();
            }, 350);
          }
        }, 100);
      }
    }

    function clearKey() { inputPass = ''; updatePassDots(); }

    function updatePassDots() {
      for (let i = 1; i <= 4; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (i <= inputPass.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
      }
    }

    function openApp(name) {
      appTitle.textContent = name;
      appBody.innerHTML = '';

      if (name === '設定') {
        appBody.innerHTML = `
          <div style="padding:16px;display:flex;flex-direction:column;gap:12px;">
            <div style="padding:16px;background:#1c1c24;border-radius:14px;text-align:center;">
              <img src="https://i.ibb.co/0RHgQJcw/Background-Eraser.png" style="width:50px;height:50px;object-fit:contain;margin-bottom:8px;">
              <h3>FRX OS 1 客製化中心</h3>
              <p style="font-size:12px;color:#8e8e93;margin-top:4px;">系統版本 1.0.0 (純淨旗艦版)</p>
            </div>

            <!-- 1. 桌布與外觀 -->
            <div class="settings-group">
              <div class="settings-title">🎨 桌面與鎖屏桌布</div>
              <div style="display:flex;flex-direction:column;gap:10px;">
                <input type="text" id="cfg-bg-url" class="setting-input" value="${settings.bgUrl}" placeholder="輸入圖片網址 URL">
                <div style="display:flex;gap:8px;">
                  <button class="setting-btn" style="flex:1;" onclick="updateBgUrl()">套用網址圖片</button>
                  <label class="setting-btn" style="background:#34c759;cursor:pointer;">
                    上傳照片
                    <input type="file" accept="image/*" style="display:none;" onchange="uploadLocalBg(event)">
                  </label>
                </div>
              </div>
            </div>

            <!-- 2. 圖示尺寸與圓角 -->
            <div class="settings-group">
              <div class="settings-title">📱 App 圖示客製化</div>
              <div class="settings-row">
                <span>圖示圓角 (${settings.iconRadius}px)</span>
                <input type="range" min="0" max="30" value="${settings.iconRadius}" oninput="updateIconStyle('iconRadius', this.value)">
              </div>
              <div class="settings-row">
                <span>圖示大小 (${settings.iconSize}px)</span>
                <input type="range" min="45" max="70" value="${settings.iconSize}" oninput="updateIconStyle('iconSize', this.value)">
              </div>
            </div>

            <!-- 3. 動態島設定 -->
            <div class="settings-group">
              <div class="settings-title">🏝️ 動態島設定</div>
              <div class="settings-row">
                <span>顯示動態島</span>
                <input type="checkbox" ${settings.showIsland ? 'checked' : ''} onchange="toggleIsland(this.checked)">
              </div>
              <div style="display:flex;gap:8px;margin-top:8px;">
                <input type="text" id="cfg-island-text" class="setting-input" value="${settings.islandText}" placeholder="動態島文字">
                <button class="setting-btn" onclick="updateIslandText()">套用</button>
              </div>
            </div>

            <!-- 4. 安全性與解鎖 -->
            <div class="settings-group">
              <div class="settings-title">🔒 鎖屏與安全性</div>
              <div class="settings-row">
                <span>啟用數字密碼鎖</span>
                <input type="checkbox" ${settings.enableLockscreen ? 'checked' : ''} onchange="toggleLockscreen(this.checked)">
              </div>
              <div style="display:flex;gap:8px;margin-top:8px;">
                <input type="password" id="cfg-pass" maxlength="4" class="setting-input" placeholder="修改 4 位密碼 (目前:${settings.passcode})">
                <button class="setting-btn" onclick="updatePasscode()">儲存</button>
              </div>
            </div>

            <button onclick="lockscreen.classList.remove('unlocked');closeApp();" class="setting-btn" style="background:#ff3b30;padding:12px;">🔒 立即鎖定手機</button>
            <button onclick="resetSettings()" class="setting-btn" style="background:#8e8e93;padding:12px;">🔄 恢復出廠設定</button>
          </div>
        `;

      } else if (name === '瀏覽器') {
        appBody.innerHTML = `
          <div style="padding:10px;background:#1c1c24;display:flex;gap:8px;">
            <input type="text" id="browser-url" value="https://bing.com" class="setting-input">
            <button onclick="navigateUrl()" class="setting-btn">前往</button>
          </div>
          <iframe id="browser-iframe" class="app-iframe" src="https://bing.com"></iframe>
        `;

      } else if (name === '地圖') {
        appBody.innerHTML = `
          <iframe class="app-iframe" src="https://www.openstreetmap.org/export/embed.html?bbox=121.50,25.00,121.58,25.08&layer=mapnik"></iframe>
        `;

      } else if (name === '計算機') {
        appBody.innerHTML = `
          <div style="margin:auto;width:100%;max-width:300px;text-align:right;padding:20px;">
            <div id="calc-res" style="font-size:48px;margin-bottom:20px;">0</div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
              <button onclick="calc('C')" style="height:60px;border-radius:50%;border:none;background:#a5a5a5;color:#000;font-size:20px;">C</button>
              <button onclick="calc('/')" style="height:60px;border-radius:50%;border:none;background:#ff9f0a;color:#fff;font-size:20px;">÷</button>
              <button onclick="calc('*')" style="height:60px;border-radius:50%;border:none;background:#ff9f0a;color:#fff;font-size:20px;">×</button>
              <button onclick="calc('-')" style="height:60px;border-radius:50%;border:none;background:#ff9f0a;color:#fff;font-size:20px;">-</button>
              <button onclick="calc('7')" style="height:60px;border-radius:50%;border:none;background:#333;color:#fff;font-size:20px;">7</button>
              <button onclick="calc('8')" style="height:60px;border-radius:50%;border:none;background:#333;color:#fff;font-size:20px;">8</button>
              <button onclick="calc('9')" style="height:60px;border-radius:50%;border:none;background:#333;color:#fff;font-size:20px;">9</button>
              <button onclick="calc('+')" style="height:60px;border-radius:50%;border:none;background:#ff9f0a;color:#fff;font-size:20px;">+</button>
              <button onclick="calc('4')" style="height:60px;border-radius:50%;border:none;background:#333;color:#fff;font-size:20px;">4</button>
              <button onclick="calc('5')" style="height:60px;border-radius:50%;border:none;background:#333;color:#fff;font-size:20px;">5</button>
              <button onclick="calc('6')" style="height:60px;border-radius:50%;border:none;background:#333;color:#fff;font-size:20px;">6</button>
              <button onclick="calc('=')" style="height:60px;border-radius:50%;border:none;background:#ff9f0a;color:#fff;font-size:20px;">=</button>
            </div>
          </div>
        `;

      } else if (name === '記事本') {
        const saved = localStorage.getItem('frx_notes') || '';
        appBody.innerHTML = `
          <div style="padding:16px;display:flex;flex-direction:column;height:100%;">
            <textarea id="note-txt" style="flex:1;background:none;border:none;color:#fff;font-size:16px;outline:none;resize:none;" placeholder="在此輸入筆記...">${saved}</textarea>
            <button onclick="saveNote()" class="setting-btn" style="background:#34c759;padding:12px;">儲存筆記</button>
          </div>
        `;

      } else {
        appBody.innerHTML = `
          <div style="margin:auto;text-align:center;padding:20px;">
            <div style="font-size:50px;margin-bottom:10px;">📲</div>
            <h3>${name} 正常運作中</h3>
          </div>
        `;
      }

      appWindow.classList.add('active');
    }

    function closeApp() { appWindow.classList.remove('active'); }

    // 設定操作函式
    function updateBgUrl() {
      const url = document.getElementById('cfg-bg-url').value;
      if (url) {
        settings.bgUrl = url;
        applySettings();
        alert('✨ 桌布網址套用成功！');
      }
    }

    function uploadLocalBg(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          settings.bgUrl = evt.target.result;
          applySettings();
          alert('🖼️ 本地照片已成功設定為桌布！');
        };
        reader.readAsDataURL(file);
      }
    }

    function updateIconStyle(key, val) {
      settings[key] = val;
      applySettings();
    }

    function toggleIsland(checked) {
      settings.showIsland = checked;
      applySettings();
    }

    function updateIslandText() {
      const txt = document.getElementById('cfg-island-text').value;
      if (txt) {
        settings.islandText = txt;
        applySettings();
        alert('🏝️ 動態島文字已更新！');
      }
    }

    function toggleLockscreen(checked) {
      settings.enableLockscreen = checked;
      applySettings();
    }

    function updatePasscode() {
      const p = document.getElementById('cfg-pass').value;
      if (p.length === 4 && !isNaN(p)) {
        settings.passcode = p;
        applySettings();
        alert('🔑 解鎖密碼已更換為：' + p);
      } else {
        alert('請輸入 4 位數字');
      }
    }

    function resetSettings() {
      if (confirm('確定要恢復出廠設定嗎？')) {
        localStorage.removeItem('frx_settings');
        location.reload();
      }
    }

    function navigateUrl() {
      let url = document.getElementById('browser-url').value;
      if (!url.startsWith('http')) url = 'https://' + url;
      document.getElementById('browser-iframe').src = url;
    }

    function saveNote() {
      const txt = document.getElementById('note-txt').value;
      localStorage.setItem('frx_notes', txt);
      alert('📝 筆記已成功儲存！');
    }

    let cVal = '0';
    function calc(v) {
      const d = document.getElementById('calc-res');
      if (v === 'C') cVal = '0';
      else if (v === '=') { try { cVal = eval(cVal).toString(); } catch { cVal = 'Error'; } }
      else { cVal = (cVal === '0') ? v : cVal + v; }
      d.textContent = cVal;
    }
  </script>
</body>
</html>
