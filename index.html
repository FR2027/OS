<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nexus Flow OS Pro</title>
    <style>
        :root {
            --bg-dark: #04060a;
            --accent-orange: #ff6b4a;
            --accent-cyan: #00f2fe;
            --accent-purple: #8a2be2;
            --glass-card: rgba(22, 27, 46, 0.65);
            --glass-border: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.05));
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 手機機身外觀 */
        .phone-frame {
            width: 390px;
            height: 812px;
            background: #000;
            border-radius: 54px;
            border: 4px solid #2a2e3d;
            box-shadow: 0 0 80px rgba(0, 242, 254, 0.15), 0 30px 100px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
        }

        /* 螢幕主體 */
        .phone-screen {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 80% 20%, #1f2538 0%, #080a12 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 18px 20px;
        }

        /* 壁紙流體背景光 */
        .glow-orb-1 {
            position: absolute;
            width: 300px; height: 300px;
            top: 25%; left: -20%;
            background: radial-gradient(circle, rgba(255, 107, 74, 0.35) 0%, rgba(0,0,0,0) 70%);
            filter: blur(40px);
            pointer-events: none;
        }
        .glow-orb-2 {
            position: absolute;
            width: 250px; height: 250px;
            top: 10%; right: -10%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.25) 0%, rgba(0,0,0,0) 70%);
            filter: blur(40px);
            pointer-events: none;
        }

        /* 狀態列 */
        .status-bar {
            height: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 20;
            padding: 0 4px;
        }

        /* 頂部動態島膠囊 */
        .dynamic-capsule {
            position: absolute;
            top: 12px; left: 50%;
            transform: translateX(-50%);
            width: 96px; height: 24px;
            background: #000;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 25;
        }

        /* 右側懸浮式 Dynamic Dock 欄 */
        .side-dock-container {
            position: absolute;
            right: 14px;
            top: 16%;
            width: 62px;
            background: rgba(18, 23, 38, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 32px;
            padding: 18px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 50;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: -10px 20px 40px rgba(0, 0, 0, 0.5);
        }

        .dock-item {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .dock-item:active {
            transform: scale(0.82);
            background: var(--accent-orange);
            box-shadow: 0 0 15px var(--accent-orange);
        }

        .dock-item svg {
            width: 20px; height: 20px; stroke: #ffffff; fill: none; stroke-width: 2;
        }

        /* 主畫面卡片串流 (Now Flow) */
        .content-scroll {
            width: calc(100% - 72px);
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 20;
            overflow-y: auto;
            scrollbar-width: none;
            height: calc(100% - 60px);
            padding-bottom: 20px;
        }
        .content-scroll::-webkit-scrollbar { display: none; }

        .flow-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2px;
        }

        .flow-title {
            font-size: 1.35rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, var(--text-sub));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 通用毛玻璃卡片樣式 */
        .glass-card {
            background: var(--glass-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-card:active {
            transform: scale(0.97);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .card-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .card-icon-box {
            width: 42px; height: 42px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem;
        }

        .card-meta { flex: 1; }
        .card-label { font-size: 0.88rem; font-weight: 600; color: #fff; }
        .card-sub { font-size: 0.74rem; color: var(--text-sub); margin-top: 3px; }

        /* 核心卡片：音樂播放器 */
        .music-player-card {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: linear-gradient(145deg, rgba(30, 36, 58, 0.8), rgba(15, 18, 30, 0.8));
        }

        .music-visualizer {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 40px;
        }

        .eq-bar {
            width: 4px;
            height: 100%;
            background: var(--accent-orange);
            border-radius: 4px;
            animation: eqBounce 1.2s infinite ease-in-out alternate;
        }
        .eq-bar:nth-child(2) { animation-delay: 0.15s; background: var(--accent-cyan); }
        .eq-bar:nth-child(3) { animation-delay: 0.3s; background: var(--accent-purple); }
        .eq-bar:nth-child(4) { animation-delay: 0.45s; background: var(--accent-orange); }
        .eq-bar:nth-child(5) { animation-delay: 0.2s; background: #fff; }

        @keyframes eqBounce {
            0% { height: 15%; }
            100% { height: 90%; }
        }

        .music-info-title { font-size: 1.05rem; font-weight: 700; }
        .music-info-artist { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }

        .player-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .play-circle {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff, #d0d0d0);
            color: #000;
            display: flex; justify-content: center; align-items: center;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
        }

        /* 全域提示 Modal */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            width: 270px;
            background: linear-gradient(145deg, rgba(30, 36, 56, 0.95), rgba(16, 20, 32, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.show .modal-box { transform: scale(1); }

        .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
        .modal-desc { font-size: 0.82rem; color: var(--text-sub); margin-bottom: 22px; }

        .modal-btn {
            background: linear-gradient(90deg, var(--accent-orange), var(--accent-purple));
            color: #fff;
            font-weight: 600;
            border: none;
            padding: 11px 0;
            width: 100%;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.88rem;
            box-shadow: 0 8px 20px rgba(255, 107, 74, 0.3);
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="phone-screen">
            
            <!-- 背景流體發光燈效 -->
            <div class="glow-orb-1"></div>
            <div class="glow-orb-2"></div>

            <!-- 狀態列與動態島 -->
            <div class="status-bar">
                <span>10:08</span>
                <span style="color:var(--accent-cyan);">5G 95%</span>
            </div>
            <div class="dynamic-capsule"></div>

            <!-- 右側直立式 Dynamic Dock -->
            <div class="side-dock-container">
                <div class="dock-item app-trigger"><svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></div>
                <div class="dock-item app-trigger"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></div>
                <div class="dock-item app-trigger"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
                <div class="dock-item app-trigger"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
                <div class="dock-item app-trigger"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
            </div>

            <!-- 主畫面動態卡片流 -->
            <div class="content-scroll">
                
                <div class="flow-header">
                    <div class="flow-title">Now Flow</div>
                    <span style="font-size:0.75rem; color:var(--text-sub);">12:08 AM</span>
                </div>

                <!-- 卡片 1：會議 -->
                <div class="glass-card app-trigger">
                    <div class="card-row">
                        <div class="card-icon-box">📅</div>
                        <div class="card-meta">
                            <div class="card-label">Meeting in 15 mins</div>
                            <div class="card-sub">UI/UX Design Concept Review</div>
                        </div>
                    </div>
                </div>

                <!-- 卡片 2：天氣 -->
                <div class="glass-card app-trigger">
                    <div class="card-row">
                        <div class="card-icon-box">🌤️</div>
                        <div class="card-meta">
                            <div class="card-label">Sunny 24°C</div>
                            <div class="card-sub">Taoyuan City, Taiwan</div>
                        </div>
                    </div>
                </div>

                <!-- 卡片 3：大型音樂卡片 -->
                <div class="glass-card music-player-card app-trigger">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:0.7rem; color:var(--accent-orange); font-weight:700; letter-spacing:1px;">NOW PLAYING</span>
                        <span style="font-size:0.7rem; color:var(--text-sub);">Spotify</span>
                    </div>

                    <div class="music-visualizer">
                        <div class="equalizer">
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                        </div>
                    </div>

                    <div>
                        <div class="music-info-title">Arctic Monkeys</div>
                        <div class="music-info-artist">Do I Wanna Know?</div>
                    </div>

                    <div class="player-controls">
                        <span style="font-size:1.1rem; color:var(--text-sub);">⏮</span>
                        <div class="play-circle">▲</div>
                        <span style="font-size:1.1rem; color:var(--text-sub);">⏭</span>
                    </div>
                </div>

                <!-- 卡片 4：訊息 -->
                <div class="glass-card app-trigger">
                    <div class="card-row">
                        <div class="card-icon-box">💬</div>
                        <div class="card-meta">
                            <div class="card-label">From Sarah</div>
                            <div class="card-sub">See you soon!</div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- 系統點擊 Modal -->
            <div class="modal-overlay" id="modal">
                <div class="modal-box">
                    <div class="modal-title">Nexus Flow OS</div>
                    <div class="modal-desc">暫時不支援預覽</div>
                    <button class="modal-btn" onclick="closeModal()">確定</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        const modal = document.getElementById('modal');

        document.querySelectorAll('.app-trigger').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                modal.classList.add('show');
            });
        });

        function closeModal() {
            modal.classList.remove('show');
        }
    </script>
</body>
</html>
